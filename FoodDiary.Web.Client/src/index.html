<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Food Diary and Calorie Tracker | Food Diary</title>
        <meta
            name="description"
            content="Track meals, calories and macros, save recipes and follow your weight. Start a free food diary with manual meal logging."
        />
        <meta name="keywords" content="nutrition, food diary, health, food" />
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="text-scale" content="scale" />
        <meta name="color-scheme" content="light dark" />
        <meta name="theme-color" content="#ffffff" />
        <style>
            html.fd-session-route-pending {
                background: var(--fd-bg-body);
            }

            html.fd-session-route-pending fd-root {
                visibility: hidden;
                opacity: 0;
                pointer-events: none;
            }
        </style>
        <script>
            (() => {
                const isAndroidWebView = navigator.userAgent.includes('Android') && navigator.userAgent.includes('; wv');
                const isCapacitorLocalHost = location.protocol === 'https:' && location.hostname === 'localhost';

                if (isAndroidWebView && isCapacitorLocalHost && location.pathname === '/') {
                    location.replace('/mobile/login');
                    return;
                }

                try {
                    // Public hints control the startup veil; the API still proves the HttpOnly session.
                    const hasStoredSession =
                        localStorage.getItem('accountAccess') !== null ||
                        localStorage.getItem('userId') !== null ||
                        sessionStorage.getItem('userId') !== null ||
                        sessionStorage.getItem('impersonationContext') !== null;

                    if (hasStoredSession) {
                        const root = document.documentElement;
                        root.classList.add('fd-session-route-pending');

                        // Run before the prerendered body can paint, including on workspace deep links.
                        const theme = localStorage.getItem('fd_theme');
                        if (['ocean', 'leaf', 'dark'].includes(theme)) {
                            root.setAttribute('data-theme', theme);
                            root.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
                            document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#191c21' : '#ffffff';
                        }
                        const uiStyle = localStorage.getItem('fd_ui_style');
                        if (['classic', 'modern'].includes(uiStyle)) {
                            root.setAttribute('data-ui-style', uiStyle);
                        }
                        const surfaceStyle = localStorage.getItem('fd_surface_style');
                        if (['normal', 'matte', 'glass'].includes(surfaceStyle)) {
                            root.setAttribute('data-surface-style', surfaceStyle);
                        }
                    }
                } catch {
                    // Storage can be unavailable in hardened browser contexts; the route guard remains authoritative.
                }
            })();
        </script>
        <link rel="icon" type="image/svg+xml" href="/assets/images/header/logo.svg" />
        <link rel="alternate icon" type="image/x-icon" href="/assets/images/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="/assets/pwa/app-icon-180x180.png" />
        <!-- Escape the previously year-long HTTP cache; id=/ preserves the installed app identity. -->
        <link rel="manifest" href="/assets/manifest.webmanifest?v=20261027" />

        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Food Diary" />
        <meta property="og:title" content="Food Diary and Calorie Tracker | Food Diary" />
        <meta
            property="og:description"
            content="Track meals, calories and macros, save recipes and follow your weight. Start a free food diary with manual meal logging."
        />
        <meta property="og:url" content="https://fooddiary.club" />
        <meta property="og:image" content="https://fooddiary.club/assets/images/seo/food-diary-meal-tracking.png" />

        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Food Diary and Calorie Tracker | Food Diary" />
        <meta
            name="twitter:description"
            content="Track meals, calories and macros, save recipes and follow your weight. Start a free food diary with manual meal logging."
        />
        <meta name="twitter:image" content="https://fooddiary.club/assets/images/seo/food-diary-meal-tracking.png" />

        <link rel="canonical" href="https://fooddiary.club" />
    </head>
    <body>
        <fd-root></fd-root>
        <noscript>Please enable JavaScript to continue using this application.</noscript>
    </body>
</html>
