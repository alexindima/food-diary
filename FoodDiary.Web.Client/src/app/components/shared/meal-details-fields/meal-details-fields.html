<div
    class="meal-details-fields fd-grid fd-gap-sm"
    [class.meal-details-fields--surface]="surface()"
    [class.meal-details-fields--regular]="density() === 'regular'"
>
    <div class="meal-details-fields__date-time fd-grid fd-gap-xs">
        <fd-ui-date-input
            [size]="density() === 'compact' ? 'md' : 'lg'"
            [label]="'MEAL_DETAILS.DATE' | translate"
            [value]="date()"
            (valueChange)="onDateChange($event)"
        />
        <fd-ui-time-input
            [size]="density() === 'compact' ? 'md' : 'lg'"
            [label]="'MEAL_DETAILS.TIME' | translate"
            [hoursLabel]="'MEAL_DETAILS.HOURS' | translate"
            [minutesLabel]="'MEAL_DETAILS.MINUTES' | translate"
            [value]="time()"
            (valueChange)="onTimeChange($event)"
        />
    </div>

    <div class="meal-details-fields__field fd-grid fd-gap-xxs">
        <label class="meal-details-fields__label fd-ui-field-label fd-ui-field-label--floating" for="meal-details-comment">
            {{ 'MEAL_DETAILS.COMMENT' | translate }}
        </label>
        <textarea
            #commentInput
            id="meal-details-comment"
            class="meal-details-fields__textarea fd-ui-body-sm"
            [rows]="textareaRows()"
            [value]="comment()"
            (input)="comment.set(commentInput.value)"
        ></textarea>
    </div>

    <fd-meal-satiety-fields
        [layout]="satietyLayout() === 'columns' ? 'columns' : 'stacked'"
        [preMealSatietyLevel]="preMealSatietyLevel()"
        [postMealSatietyLevel]="postMealSatietyLevel()"
        (preMealSatietyLevelChange)="onPreMealSatietyLevelChange($event)"
        (postMealSatietyLevelChange)="onPostMealSatietyLevelChange($event)"
    />
</div>
