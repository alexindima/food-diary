<div
    class="meal-satiety-fields fd-grid fd-gap-sm"
    [class.meal-satiety-fields--columns]="layout() === 'columns'"
    [class.meal-satiety-fields--compact-columns]="layout() === 'compactColumns'"
>
    <div class="meal-satiety-fields__field fd-grid fd-gap-xxs">
        <div class="fd-row fd-wrap fd-align-center fd-justify-between fd-gap-xs">
            <p class="meal-satiety-fields__label fd-ui-field-label fd-ui-field-label--floating">{{ labelBeforeKey() | translate }}</p>
            <fd-ui-button
                variant="secondary"
                fill="text"
                size="sm"
                [disabled]="preMealSatietyLevel() === null"
                [disabledReason]="'MEAL_DETAILS.SATIETY_UNANSWERED' | translate"
                (click)="onSatietyLevelChange('before', null)"
            >
                {{ 'MEAL_DETAILS.CLEAR_HUNGER' | translate }}
            </fd-ui-button>
        </div>
        <fd-ui-emoji-picker
            [size]="pickerSize()"
            [options]="hungerEmojiOptions"
            [selectedValue]="preMealSatietyLevel()"
            [ariaLabel]="preMealSatietyAriaLabel()"
            (selectedValueChange)="onSatietyLevelChange('before', $event)"
        />
    </div>

    <div class="meal-satiety-fields__field fd-grid fd-gap-xxs">
        <div class="fd-row fd-wrap fd-align-center fd-justify-between fd-gap-xs">
            <p class="meal-satiety-fields__label fd-ui-field-label fd-ui-field-label--floating">{{ labelAfterKey() | translate }}</p>
            <fd-ui-button
                variant="secondary"
                fill="text"
                size="sm"
                [disabled]="postMealSatietyLevel() === null"
                [disabledReason]="'MEAL_DETAILS.SATIETY_UNANSWERED' | translate"
                (click)="onSatietyLevelChange('after', null)"
            >
                {{ 'MEAL_DETAILS.CLEAR_SATIETY' | translate }}
            </fd-ui-button>
        </div>
        <fd-ui-emoji-picker
            [size]="pickerSize()"
            [options]="satietyEmojiOptions"
            [selectedValue]="postMealSatietyLevel()"
            [ariaLabel]="postMealSatietyAriaLabel()"
            (selectedValueChange)="onSatietyLevelChange('after', $event)"
        />
    </div>
</div>
