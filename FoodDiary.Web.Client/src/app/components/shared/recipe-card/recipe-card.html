<fd-entity-card
    imageIcon="restaurant_menu"
    [backgroundKey]="recipe().id ?? ''"
    [imageUrl]="displayImage()"
    [imageAlt]="recipe().name"
    [previewable]="hasPreviewImage()"
    [showFavorite]="canToggleFavorite()"
    [isFavorite]="isFavorite()"
    [favoriteLoading]="favoriteLoading()"
    [favoriteAriaLabel]="favoriteAriaLabelKey() | translate"
    [ownershipIcon]="ownershipIcon()"
    [title]="recipe().name"
    [description]="description()"
    [comment]="recipe().comment"
    [nutrition]="nutrition()"
    [quality]="quality()"
    [calories]="recipe().totalCalories ?? null"
    [nutritionNote]="
        (recipe().missingIngredientCount ?? 0) > 0
            ? ('NUTRITION_COMPLETENESS.PARTIAL' | translate: { count: recipe().missingIngredientCount })
            : null
    "
    [showAction]="true"
    [compactAction]="true"
    [actionLabel]="'RECIPE_CARD.TO_DIARY' | translate"
    [actionAriaLabel]="'RECIPE_CARD.ADD_TO_MEAL' | translate"
    (open)="openCard()"
    (preview)="previewCardImage()"
    (favoriteToggle)="toggleFavorite()"
    (action)="addToMealFromCard()"
/>
