@if (entry().meal; as meal) {
    <fd-meal-card
        class="meals-preview__meal-card"
        [meal]="meal"
        [favoriteLoading]="favoriteLoadingIds().has(meal.id)"
        (favoriteToggle)="favoriteToggle.emit(meal)"
        (open)="open.emit(meal)"
    />
} @else if (showAddButtons()) {
    @let mealLabel = entry().labelKey || 'MEAL_CARD.MEAL_TYPES.OTHER' | translate;
    <div class="meals-preview__placeholder" [class.meals-preview__placeholder--expanded]="isExpanded()">
        <button
            class="meals-preview__placeholder-main fd-row fd-align-center fd-gap-card-content"
            type="button"
            [disabled]="isAiMealSaving()"
            [attr.aria-expanded]="canExpand() ? isExpanded() : null"
            [attr.aria-controls]="canExpand() ? panelId : null"
            [attr.aria-label]="
                (isExpanded() ? 'MEALS_PREVIEW.COLLAPSE_MEAL' : 'MEALS_PREVIEW.ADD_TO_MEAL') | translate: { meal: mealLabel }
            "
            (click)="activate()"
        >
            <span class="meals-preview__placeholder-icon fd-place-center">
                <fd-ui-icon size="sm" [name]="entry().icon || 'restaurant_menu'" />
            </span>
            <span class="meals-preview__placeholder-text fd-ui-body">{{ mealLabel }}</span>
            <fd-ui-icon class="meals-preview__placeholder-toggle" size="md" [name]="isExpanded() ? 'close' : 'add'" />
        </button>
        @if (canExpand()) {
            <div class="meals-preview__ai-panel" [id]="panelId" [hidden]="!isExpanded()">
                @if (hasOpened()) {
                    <fd-ai-input-bar
                        mode="create"
                        historyLabelKey="MEALS_PREVIEW.HISTORY_ACTION"
                        [mealType]="entry().slot ?? null"
                        [active]="isExpanded()"
                        [isProcessing]="isAiMealSaving()"
                        [clearToken]="aiMealClearToken()"
                        (mealCreateRequested)="aiMealCreateRequested.emit($event)"
                    >
                        <fd-ui-button
                            inputActions
                            type="button"
                            variant="secondary"
                            fill="text"
                            size="sm"
                            icon="add"
                            iconSize="sm"
                            [ariaLabel]="'MEALS_PREVIEW.MANUAL_ACTION' | translate"
                            [disabled]="isAiMealSaving()"
                            [disabledReason]="'MEALS_PREVIEW.SAVING_HINT' | translate"
                            (click)="add.emit(entry().slot)"
                        >
                            {{ 'MEALS_PREVIEW.MANUAL_ACTION' | translate }}
                        </fd-ui-button>
                    </fd-ai-input-bar>
                }
            </div>
        }
    </div>
}
