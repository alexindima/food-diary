<section class="meals-preview fd-stack fd-gap-card-content">
    <div class="meals-preview__header fd-row fd-align-center fd-justify-between fd-gap-card-header">
        <h2 class="meals-preview__title fd-ui-title-md">{{ titleText() || (titleKey() | translate) }}</h2>
        @if (showViewAll()) {
            <fd-ui-button class="meals-preview__view-all" variant="primary" fill="text" size="sm" (click)="viewAll.emit()">
                <span class="fd-row fd-align-center fd-gap-xs">
                    {{ viewAllKey() | translate }}
                    <fd-ui-icon name="arrow_forward" size="sm" />
                </span>
            </fd-ui-button>
        }
    </div>

    <div class="meals-preview__list fd-stack fd-gap-card-content">
        @if (!entries().length && showEmptyState()) {
            <div class="meals-preview__empty fd-ui-body-sm">{{ emptyKey() | translate }}</div>
        } @else {
            @for (entry of entries(); track entry.meal?.id ?? entry.slot ?? $index) {
                <fd-meals-preview-entry
                    [entry]="entry"
                    [showAddButtons]="showAddButtons()"
                    [showAiButtons]="showAiButtons()"
                    [expandedAiSlot]="expandedAiSlot()"
                    [isAiMealSaving]="isAiMealSaving()"
                    [aiMealClearToken]="aiMealClearTokens().get(entry.slot ?? '') ?? 0"
                    [favoriteLoadingIds]="favoriteLoadingIds()"
                    (favoriteToggle)="favoriteToggle.emit($event)"
                    (open)="open.emit($event)"
                    (add)="add.emit($event)"
                    (aiToggle)="toggleAi($event)"
                    (aiMealCreateRequested)="createMealFromAiResult($event)"
                />
            }
        }
    </div>
</section>
