<div class="ai-input-bar__composer" [class.ai-input-bar__composer--attached]="hasAttachedResult()">
    <div class="ai-input-bar fd-row fd-gap-control">
        <fd-image-upload-field
            class="ai-input-bar__hidden-upload"
            appearance="hidden"
            [cropEnabled]="false"
            [resizeMaxDimension]="1536"
            [deleteOnClear]="true"
            (imagePreparationStarted)="onPhotoPreparationStarted($event)"
            (imagePreparationFailed)="onPhotoPreparationFailed()"
            (imageChanged)="onPhotoSelected($event)"
        />
        <fd-ui-icon class="ai-input-bar__icon" name="auto_awesome" />
        <input
            type="text"
            enterkeyhint="send"
            class="ai-input-bar__input fd-ui-body-sm"
            [placeholder]="'AI_INPUT_BAR.SHORT_PLACEHOLDER' | translate"
            [attr.aria-label]="'MEAL_LIST.VOICE_PLACEHOLDER' | translate"
            [value]="voiceText()"
            [disabled]="isDisabled()"
            (input)="onTextInput($event)"
            (fdUiTextEnter)="submitTextAsync()"
        />
        @let hasText = !!voiceText().trim();
        <div
            class="ai-input-bar__controls"
            [class.ai-input-bar__controls--text]="hasText"
            [class.ai-input-bar__controls--single]="!isSpeechSupported"
        >
            <div class="ai-input-bar__capture" [inert]="hasText">
                <fd-ui-button
                    class="ai-input-bar__action-btn"
                    variant="secondary"
                    fill="solid"
                    icon="photo_camera"
                    iconSize="lg"
                    fdUiHintPosition="bottom"
                    [disabled]="isDisabled()"
                    [fdUiHint]="'AI_INPUT_BAR.PHOTO_TITLE' | translate"
                    [ariaLabel]="'AI_INPUT_BAR.PHOTO_TITLE' | translate"
                    (click)="onPhotoClickAsync()"
                />
                @if (isSpeechSupported) {
                    <fd-ui-button
                        class="ai-input-bar__action-btn"
                        variant="secondary"
                        fill="solid"
                        iconSize="lg"
                        fdUiHintPosition="bottom"
                        [icon]="microphoneIcon()"
                        [ariaPressed]="isListening()"
                        [class.ai-input-bar__action-btn--mic-active]="isListening()"
                        [disabled]="isMicrophoneDisabled()"
                        [disabledReason]="isMicrophoneDisabled() ? ('DISABLED_HINTS.OPERATION_BUSY' | translate) : null"
                        [fdUiHint]="'MEAL_LIST.VOICE_MIC_TITLE' | translate"
                        [ariaLabel]="'MEAL_LIST.VOICE_MIC_TITLE' | translate"
                        (click)="toggleMicAsync()"
                    />
                }
            </div>
            <div class="ai-input-bar__send" [inert]="!hasText">
                <fd-ui-button
                    class="ai-input-bar__submit"
                    variant="primary"
                    fill="solid"
                    appearance="ai-action"
                    iconSize="lg"
                    [icon]="textSubmitIcon()"
                    [disabled]="isDisabled()"
                    [disabledReason]="isDisabled() ? ('DISABLED_HINTS.OPERATION_BUSY' | translate) : null"
                    [ariaLabel]="'AI_INPUT_BAR.ADD_ACTION' | translate"
                    (click)="submitTextAsync()"
                />
            </div>
        </div>
    </div>

    @if (speechErrorKey(); as errorKey) {
        <fd-ui-inline-alert
            class="ai-input-bar__speech-error"
            appearance="notice"
            severity="danger"
            role="alert"
            [message]="errorKey | translate"
        />
    }

    <div #actionsElement class="ai-input-bar__actions fd-row fd-justify-between fd-gap-xs">
        <div #manualActionsElement class="ai-input-bar__manual-actions">
            <ng-content select="[inputActions]" />
        </div>
        <fd-ui-button
            #historyElement
            class="ai-input-bar__history"
            type="button"
            icon="history"
            variant="secondary"
            fill="text"
            size="sm"
            iconSize="sm"
            [class.ai-input-bar__history--labeled]="historyLabelKey() !== null"
            [class.ai-input-bar__history--compact]="isHistoryLabelCompact()"
            [ariaLabel]="'AI_RECOGNITION.SHOW_RECENT' | translate"
            [fdUiHint]="'AI_RECOGNITION.SHOW_RECENT' | translate"
            [disabled]="isDisabled()"
            [disabledReason]="'DISABLED_HINTS.OPERATION_BUSY' | translate"
            (click)="openRecognitionHistory()"
        >
            <span #historyLabelElement class="ai-input-bar__history-label">{{
                historyLabelKey() ?? 'AI_RECOGNITION.SHOW_RECENT' | translate
            }}</span>
        </fd-ui-button>
    </div>
</div>

@if (hasTextResult()) {
    <fd-ai-photo-result
        class="ai-input-bar__result-panel"
        titleKey="MEAL_LIST.VOICE_RESULT_TITLE"
        sourceTextLabelKey="AI_INPUT_BAR.TEXT_PREVIEW_LABEL"
        [sourceText]="textSubmittedQuery()"
        [submitLabelKey]="submitLabelKey()"
        [showDetails]="showDetails()"
        [results]="textResults()"
        [isAnalyzing]="textIsAnalyzing()"
        [isNutritionLoading]="textIsNutritionLoading()"
        [nutrition]="textNutrition()"
        [errorKey]="textErrorKey()"
        [nutritionErrorKey]="textNutritionErrorKey()"
        [isProcessing]="isProcessing()"
        (dismissed)="dismissTextResult()"
        (addToMeal)="onTextAddToMeal($event)"
        (editApplied)="onTextEditApplied($event)"
        (reanalyzeRequested)="onTextReanalyze()"
    />
}
