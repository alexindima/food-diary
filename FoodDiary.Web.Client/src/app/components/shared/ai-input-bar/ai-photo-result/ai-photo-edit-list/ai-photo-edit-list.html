<div class="ai-photo-result__edit-list fd-stack fd-gap-xs" cdkDropList (cdkDropListDropped)="onDrop($event)">
    @for (item of items(); track item.id; let i = $index) {
        <div class="ai-photo-result__edit-row fd-gap-xs" cdkDrag>
            <div class="ai-photo-result__edit-handle fd-inline-center" cdkDragHandle>
                <fd-ui-icon name="drag_indicator" />
            </div>
            <label class="fd-visually-hidden-focusable" [for]="`${controlIdPrefix}-${item.id}-name`">
                {{ 'MEAL_MANAGE.PHOTO_AI_DIALOG.NAME_LABEL' | translate }}
            </label>
            <input
                #nameInput
                class="ai-photo-result__edit-input ai-photo-result__edit-input--name"
                type="text"
                [id]="`${controlIdPrefix}-${item.id}-name`"
                [value]="item.name"
                [attr.aria-invalid]="showErrors() && itemError(item) === 'name' ? true : null"
                (input)="updateItem(i, 'name', nameInput.value)"
            />
            <label class="fd-visually-hidden-focusable" [for]="`${controlIdPrefix}-${item.id}-amount`">
                {{ 'MEAL_MANAGE.PHOTO_AI_DIALOG.AMOUNT_LABEL' | translate }}
            </label>
            <input
                #amountInput
                class="ai-photo-result__edit-input ai-photo-result__edit-input--amount"
                type="number"
                step="any"
                [id]="`${controlIdPrefix}-${item.id}-amount`"
                [value]="item.amount"
                [attr.aria-invalid]="showErrors() && itemError(item) === 'amount' ? true : null"
                (input)="updateItem(i, 'amount', amountInput.value)"
            />
            <label class="fd-visually-hidden-focusable" [for]="`${controlIdPrefix}-${item.id}-unit`">
                {{ 'MEAL_MANAGE.PHOTO_AI_DIALOG.UNIT_LABEL' | translate }}
            </label>
            <select
                #unitSelect
                class="ai-photo-result__edit-select"
                [id]="`${controlIdPrefix}-${item.id}-unit`"
                [value]="item.unit"
                (change)="updateItem(i, 'unit', unitSelect.value)"
            >
                @if (!hasUnitOption(item.unit)) {
                    <option [value]="item.unit" [selected]="true">{{ item.unit }}</option>
                }
                @for (unit of unitOptions(); track unit.value) {
                    <option [value]="unit.value" [selected]="unit.value === item.unit">{{ unit.label }}</option>
                }
            </select>
            <fd-ui-button
                class="ai-photo-result__edit-remove"
                variant="danger"
                fill="text"
                icon="delete"
                [fdUiHint]="'COMMON.DELETE' | translate"
                [ariaLabel]="removeItemAriaLabel(item)"
                (click)="itemRemoved.emit(i)"
            />
        </div>
        @if (showErrors() && itemError(item) !== null) {
            <p role="alert" class="fd-ui-error-text fd-ui-body-sm">
                {{ 'MEAL_MANAGE.PHOTO_AI_DIALOG.ROW_INVALID' | translate: { row: i + 1 } }}
            </p>
        }
    }
</div>
<fd-ui-button class="ai-photo-result__edit-add" variant="secondary" appearance="dashed" fullWidth (click)="itemAdded.emit()">
    + {{ 'MEAL_MANAGE.PHOTO_AI_DIALOG.ADD_ITEM' | translate }}
</fd-ui-button>
