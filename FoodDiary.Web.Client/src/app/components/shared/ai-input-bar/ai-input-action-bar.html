<div class="ai-input-action-bar fd-stack fd-gap-card-profile">
    <fd-ai-input-bar
        [mode]="mode()"
        [mealType]="mealType()"
        [historyLabelKey]="historyLabelKey()"
        [isProcessing]="isProcessing()"
        [clearToken]="clearToken()"
        (mealRecognized)="mealRecognized.emit($event)"
        (mealCreateRequested)="mealCreateRequested.emit($event)"
    >
        <div inputActions class="ai-input-action-bar__manual fd-row fd-wrap fd-gap-xs">
            @if (showManualPrefix()) {
                <span class="ai-input-action-bar__manual-label fd-ui-action-text">{{ manualPrefixLabelKey() | translate }}</span>
            }
            <fd-ui-button
                type="button"
                variant="secondary"
                fill="text"
                size="sm"
                iconSize="sm"
                [icon]="manualActionIcon()"
                [ariaLabel]="manualActionLabelKey() | translate"
                (click)="manualAction.emit()"
            >
                {{ manualActionLabelKey() | translate }}
            </fd-ui-button>
            <ng-content select="[manualActions]" />
        </div>
    </fd-ai-input-bar>
</div>
