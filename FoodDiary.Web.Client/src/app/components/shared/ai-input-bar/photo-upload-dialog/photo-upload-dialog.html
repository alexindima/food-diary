<fd-ui-dialog
    size="lg"
    [title]="'MEAL_MANAGE.PHOTO_AI_DIALOG.TITLE' | translate"
    [subtitle]="'MEAL_MANAGE.PHOTO_AI_DIALOG.SUBTITLE' | translate"
>
    <fd-image-upload-field
        [cropEnabled]="false"
        [resizeMaxDimension]="1536"
        [deleteOnClear]="true"
        (imageChanged)="onImageChanged($event)"
    />
    <div fdUiDialogFooter class="photo-upload-dialog__footer fd-row fd-justify-end">
        <fd-ui-button fill="outline" variant="secondary" (click)="close()"> {{ 'COMMON.CANCEL' | translate }} </fd-ui-button>
    </div>
</fd-ui-dialog>
