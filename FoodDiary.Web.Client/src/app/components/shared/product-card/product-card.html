<fd-entity-card
    imageIcon="restaurant"
    [catalogLayout]="catalogLayout()"
    [backgroundKey]="product().id ?? ''"
    [imageUrl]="imageUrl()"
    [imageCount]="product().images?.length ?? 0"
    [imageAlt]="product().name"
    [previewable]="hasPreviewImage()"
    [showFavorite]="canToggleFavorite()"
    [isFavorite]="isFavorite()"
    [favoriteLoading]="favoriteLoading()"
    [favoriteAriaLabel]="favoriteAriaLabelKey() | translate"
    [ownershipIcon]="ownershipIcon()"
    [title]="product().name"
    [description]="description()"
    [comment]="catalogLayout() ? null : product().comment"
    [nutrition]="nutrition()"
    [quality]="quality()"
    [calories]="product().caloriesPerBase"
    [caloriesBasis]="caloriesBasis()"
    [showAction]="true"
    [compactAction]="true"
    [actionLabel]="catalogLayout() ? null : ('PRODUCT_CARD.TO_DIARY' | translate)"
    [actionAriaLabel]="'PRODUCT_CARD.ADD_TO_MEAL' | translate"
    (open)="openCard()"
    (preview)="previewCardImage()"
    (favoriteToggle)="toggleFavorite()"
    (action)="addToMealFromCard()"
/>
