@if (products().length > 0) {
    <div class="product-list__section product-list__section--off fd-stack fd-gap-sm">
        <div class="product-list__section-header fd-row fd-gap-sm">
            <span class="product-list__section-label fd-ui-card-title"> {{ 'PRODUCT_LIST.OFF_RESULTS' | translate }} </span>
            <span class="product-list__section-line"></span>
        </div>
        <div class="product-list__off-grid fd-stack fd-gap-xs">
            @for (offProduct of products(); track offProduct.barcode) {
                <!-- The kit has no compact, fully interactive image/metadata row; retain this layout with a native button. -->
                <button type="button" class="product-list__off-card fd-row fd-gap-sm" (click)="productOpen.emit(offProduct)">
                    @if (offProduct.imageUrl) {
                        <img
                            class="product-list__off-image"
                            width="64"
                            height="64"
                            [attr.src]="offProduct.imageUrl"
                            [alt]="offProduct.name"
                        />
                    } @else {
                        <span class="product-list__off-image-placeholder fd-center">
                            <fd-ui-icon name="inventory_2" size="md" />
                        </span>
                    }
                    <span class="product-list__off-info">
                        <span class="product-list__off-name fd-ui-body-sm">{{ offProduct.name }}</span>
                        @if (offProduct.brand) {
                            <span class="product-list__off-brand fd-ui-caption">{{ offProduct.brand }}</span>
                        }
                        @if (offProduct.caloriesPer100G !== null && offProduct.caloriesPer100G !== undefined) {
                            <span class="product-list__off-kcal fd-ui-caption">
                                {{ offProduct.caloriesPer100G | number: '1.0-0' }} {{ 'PRODUCT_LIST.OFF_KCAL' | translate }}
                            </span>
                        }
                    </span>
                    <fd-ui-icon class="product-list__off-arrow" name="arrow_forward" size="md" />
                </button>
            }
        </div>
    </div>
} @else if (isLoading()) {
    <div class="product-list__section product-list__section--off fd-stack fd-gap-sm">
        <div class="product-list__section-header fd-row fd-gap-sm">
            <span class="product-list__section-label fd-ui-card-title"> {{ 'PRODUCT_LIST.OFF_RESULTS' | translate }} </span>
            <span class="product-list__section-line"></span>
        </div>
        <div class="product-list__off-grid fd-stack fd-gap-xs">
            <fd-skeleton-card />
            <fd-skeleton-card />
        </div>
    </div>
}
