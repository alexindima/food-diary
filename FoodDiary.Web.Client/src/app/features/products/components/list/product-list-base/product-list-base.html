<div class="product-list" fdPageContainer>
    <fd-page-header
        class="product-list__header"
        [title]="'PRODUCT_LIST.TITLE' | translate"
        [subtitle]="'PRODUCT_LIST.SUBTITLE' | translate"
        [compactActions]="true"
    >
        @if (isMobileView()) {
            <div class="product-list__mobile-toolbar" data-tour-id="product-list-actions">
                <fd-ui-button
                    class="product-list__icon-button product-list__icon-button--primary"
                    appearance="toolbar"
                    variant="primary"
                    fill="solid"
                    icon="add"
                    data-fd-overflow-primary
                    [fdUiHint]="'PRODUCT_LIST.ADD_PRODUCT_BUTTON' | translate"
                    [ariaLabel]="'PRODUCT_LIST.ADD_PRODUCT_BUTTON' | translate"
                    (click)="onAddProductClick()"
                />
                <fd-ui-button
                    class="product-list__icon-button product-list__filter-button"
                    appearance="toolbar"
                    variant="secondary"
                    fill="outline"
                    icon="filter_alt"
                    [fdUiHint]="'PRODUCT_LIST.FILTERS_BUTTON' | translate"
                    [ariaLabel]="'PRODUCT_LIST.FILTERS_BUTTON' | translate"
                    [class.product-list__filter-button--active]="hasActiveFilters()"
                    (click)="openFilters()"
                />

                <fd-ui-button
                    class="product-list__icon-button"
                    data-tour-id="product-list-tour-help"
                    appearance="toolbar"
                    variant="secondary"
                    fill="outline"
                    icon="help_outline"
                    [fdUiHint]="'PRODUCT_LIST.TOUR.START_TOUR' | translate"
                    [ariaLabel]="'PRODUCT_LIST.TOUR.START_TOUR' | translate"
                    (click)="startProductListTour()"
                />
            </div>
        } @else {
            <div class="product-list__header-actions" data-tour-id="product-list-actions">
                <fd-ui-button
                    class="product-list__add-button"
                    appearance="brand-action"
                    variant="primary"
                    fill="solid"
                    icon="add"
                    data-fd-overflow-primary
                    [ariaLabel]="'PRODUCT_LIST.ADD_PRODUCT_BUTTON' | translate"
                    (click)="onAddProductClick()"
                >
                    {{ 'PRODUCT_LIST.ADD_PRODUCT_BUTTON' | translate }}
                </fd-ui-button>
                <fd-ui-button
                    class="product-list__icon-button product-list__filter-button"
                    appearance="toolbar"
                    variant="secondary"
                    fill="outline"
                    icon="filter_alt"
                    [fdUiHint]="'PRODUCT_LIST.FILTERS_BUTTON' | translate"
                    [ariaLabel]="'PRODUCT_LIST.FILTERS_BUTTON' | translate"
                    [class.product-list__filter-button--active]="hasActiveFilters()"
                    (click)="openFilters()"
                />
                <fd-ui-button
                    class="product-list__icon-button"
                    data-tour-id="product-list-tour-help"
                    appearance="toolbar"
                    variant="secondary"
                    fill="outline"
                    icon="help_outline"
                    [fdUiHint]="'PRODUCT_LIST.TOUR.START_TOUR' | translate"
                    [ariaLabel]="'PRODUCT_LIST.TOUR.START_TOUR' | translate"
                    (click)="startProductListTour()"
                />
            </div>
        }
    </fd-page-header>

    <fd-page-body>
        <div class="product-list__search-toolbar">
            <div class="product-list__desktop-search" data-tour-id="product-list-search">
                <form method="post" class="product-list__search-form product-list__search-form--desktop" [formRoot]="searchForm">
                    <fd-ui-input
                        class="product-list__search-input"
                        size="md"
                        prefixIcon="search"
                        [suffixButtonIcon]="searchSuffixIcon()"
                        [formField]="searchForm.search"
                        [label]="'PRODUCT_LIST.SEARCH_LABEL' | translate"
                        [placeholder]="'PRODUCT_LIST.SEARCH_PLACEHOLDER' | translate"
                        [suffixButtonAriaLabel]="'PRODUCT_LIST.SEARCH_CLEAR' | translate"
                        (suffixButtonClicked)="clearSearch()"
                    >
                        <fd-ui-button
                            fdInputSuffix
                            appearance="toolbar"
                            variant="secondary"
                            fill="text"
                            icon="qr_code_scanner"
                            [ariaLabel]="'PRODUCT_LIST.SCAN_BARCODE' | translate"
                            (click)="openBarcodeScanner()"
                        />
                    </fd-ui-input>
                </form>
            </div>
            <fd-ui-button
                class="product-list__favorites-trigger"
                variant="secondary"
                fill="outline"
                icon="star"
                data-tour-id="product-list-favorites"
                [ariaLabel]="'PRODUCT_LIST.FAVORITES_WITH_COUNT' | translate: { count: favoriteTotalCount() }"
                [fdUiHint]="'PRODUCT_LIST.FAVORITES_TITLE' | translate"
                (click)="openFavorites()"
            >
                {{ favoriteTotalCount() }}
            </fd-ui-button>
        </div>
        @if (hasActiveFilters()) {
            <fd-active-filters
                [chips]="activeFilterChips()"
                (filterRemoved)="productListFacade.removeFilter($event)"
                (filtersReset)="productListFacade.resetFilters()"
            />
        }
        @if (errorKey()) {
            <fd-error-state (retry)="retryLoad()" />
        } @else if (productData.isLoading()) {
            <div class="product-list__section-grid fd-grid fd-gap-page-card">
                <fd-skeleton-card />
                <fd-skeleton-card />
                <fd-skeleton-card />
            </div>
        } @else {
            @if (hasVisibleProducts()) {
                <fd-product-list-groups
                    data-tour-id="product-list-results"
                    [recentItems]="recentProductItems()"
                    [allItems]="allProductItems()"
                    [allProductsSectionLabelKey]="allProductsSectionLabelKey()"
                    [favoriteLoadingIds]="favoriteLoadingIds()"
                    (openProduct)="onProductClick($event)"
                    (addToMeal)="onAddToMeal($event)"
                    (favoriteToggle)="onProductFavoriteToggle($event)"
                />
            } @else if (isEmptyState()) {
                <fd-product-list-empty-state state="empty" (addProduct)="onAddProductClick()" />
            } @else {
                <fd-product-list-empty-state state="no-results" />
            }

            <fd-product-list-off-section
                data-tour-id="product-list-external"
                [products]="offProducts()"
                [isLoading]="offLoading()"
                (productOpen)="onOffProductClick($event)"
            />
        }

        <fd-product-list-pagination
            [totalPages]="productData.totalPages"
            [length]="productData.totalItems"
            [pageSize]="pageSize"
            [pageIndex]="currentPageIndex"
            (pageChange)="onPageChange($event)"
        />
    </fd-page-body>
</div>
