<div class="meal-plan-detail" fdPageContainer>
    <fd-page-header
        [title]="'MEAL_PLANS.TITLE' | translate"
        [backVisible]="true"
        [backAriaLabel]="'MEAL_PLANS.BACK' | translate"
        (back)="goBack()"
    >
        <fd-ui-button
            data-tour-id="meal-plan-detail-tour-help"
            appearance="toolbar"
            variant="secondary"
            fill="outline"
            icon="help_outline"
            [fdUiHint]="'MEAL_PLANS.DETAIL_TOUR.START_TOUR' | translate"
            [ariaLabel]="'MEAL_PLANS.DETAIL_TOUR.START_TOUR' | translate"
            (click)="startMealPlanDetailTour()"
        />
    </fd-page-header>

    <fd-page-body>
        @if (facade.isDetailLoading()) {
            <fd-ui-loader />
        } @else if (selectedPlanView(); as plan) {
            <fd-meal-plan-detail-header
                data-tour-id="meal-plan-detail-header"
                [plan]="plan.header"
                [pendingAction]="facade.pendingAction()"
                (adoptPlan)="adopt()"
                (generateShoppingList)="generateShoppingList()"
                (deletePlan)="confirmDeletePlan()"
            />

            @if (facade.actionErrorKey(); as errorKey) {
                <p role="alert">{{ errorKey | translate }}</p>
            }

            <p class="fd-ui-caption">{{ 'MEAL_PLANS.DIARY_HINT' | translate }}</p>
            <fd-meal-plan-detail-days
                data-tour-id="meal-plan-detail-days"
                [days]="plan.days"
                [addingMealId]="facade.addingMealId()"
                [hasMealDraft]="facade.hasMealDraft()"
                (addMeal)="addMealToDiary($event)"
            />
        } @else {
            <div class="fd-stack fd-align-center fd-gap-sm">
                <p role="status">{{ 'MEAL_PLANS.DETAIL_UNAVAILABLE' | translate }}</p>
                <fd-ui-button variant="secondary" fill="outline" (click)="goBack()">
                    {{ 'MEAL_PLANS.BACK' | translate }}
                </fd-ui-button>
            </div>
        }
    </fd-page-body>
</div>
