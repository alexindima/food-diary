@let recipeForm = form(); @let errors = fieldErrors();

<fd-ui-card
    class="recipe-basic-info__card recipe-basic-info__card--basic"
    appearance="entry"
    tone="editor-white"
    density="default"
    headerAlign="start"
    accent="primary"
    [title]="'RECIPE_MANAGE.GENERAL_GROUP_TITLE' | translate"
>
    <p class="fd-ui-text-muted fd-ui-body-sm" [hidden]="recipeForm.visibility().value() !== 'Public'">
        {{ 'PUBLIC_RECIPES.PUBLISH_INGREDIENTS_HINT' | translate }}
    </p>
    <div class="recipe-basic-info__hero fd-grid fd-gap-lg">
        <div class="recipe-basic-info__hero-field fd-stack fd-gap-xs">
            <fd-ui-input
                size="lg"
                [formField]="recipeForm.name"
                [label]="'RECIPE_MANAGE.NAME' | translate"
                [placeholder]="'RECIPE_MANAGE.NAME_PLACEHOLDER' | translate"
                [error]="errors.name"
            />
        </div>
        <div class="recipe-basic-info__hero-field fd-stack fd-gap-xs">
            <fd-ui-select
                size="lg"
                [options]="categoryOptions()"
                [formField]="recipeForm.category"
                [label]="'RECIPE_MANAGE.CATEGORY' | translate"
            />
        </div>
        <div class="recipe-basic-info__hero-field fd-stack fd-gap-xs">
            <fd-ui-input
                type="number"
                size="lg"
                [formField]="recipeForm.cookTime"
                [step]="1"
                [label]="'RECIPE_MANAGE.COOK_TIME' | translate"
                [error]="errors.cookTime"
            />
        </div>
        <div class="recipe-basic-info__image">
            <fd-image-gallery-editor
                [editor]="true"
                [photos]="photos()"
                [cover]="photos()[0] ?? null"
                (photosChange)="setPhotos($event)"
                (coverChange)="setCover($event)"
                (uploadingChange)="photosUploading.emit($event)"
            />
        </div>
        <fd-ui-textarea
            class="recipe-basic-info__description"
            [formField]="recipeForm.description"
            [label]="'RECIPE_MANAGE.DESCRIPTION' | translate"
            [placeholder]="'RECIPE_MANAGE.DESCRIPTION_PLACEHOLDER' | translate"
            [rows]="2"
            [autosize]="true"
            [error]="errors.description"
        />
    </div>

    <div class="recipe-basic-info__basic-grid fd-grid fd-gap-lg">
        <fd-ui-input
            size="lg"
            type="number"
            [formField]="recipeForm.prepTime"
            [step]="1"
            [label]="'RECIPE_MANAGE.PREP_TIME' | translate"
            [error]="errors.prepTime"
        />

        <fd-ui-input
            size="lg"
            type="number"
            [formField]="recipeForm.servings"
            [step]="1"
            [label]="'RECIPE_MANAGE.SERVINGS' | translate"
            [error]="errors.servings"
        />
    </div>
    <details class="recipe-basic-info__additional">
        <summary class="fd-ui-body-sm">{{ 'RECIPE_MANAGE.ADVANCED_TITLE' | translate }} · {{ selectedVisibility() }}</summary>
        <div class="recipe-basic-info__basic-grid fd-grid fd-gap-lg">
            <fd-ui-select
                size="lg"
                [formField]="recipeForm.language"
                [label]="'RECIPE_LANGUAGE.LABEL' | translate"
                [options]="[
                    { value: 'ru', label: 'RECIPE_LANGUAGE.RU' | translate },
                    { value: 'en', label: 'RECIPE_LANGUAGE.EN' | translate },
                ]"
            />
            <div class="recipe-basic-info__field recipe-basic-info__field--full fd-stack fd-gap-xs">
                <fd-ui-select
                    size="lg"
                    [formField]="recipeForm.visibility"
                    [label]="'RECIPE_MANAGE.VISIBILITY' | translate"
                    [options]="visibilitySelectOptions()"
                    [error]="errors.visibility"
                />
            </div>
            <div class="recipe-basic-info__field recipe-basic-info__field--full fd-stack fd-gap-xs">
                <fd-ui-textarea
                    [formField]="recipeForm.comment"
                    [label]="'RECIPE_MANAGE.COMMENT' | translate"
                    [placeholder]="'RECIPE_MANAGE.COMMENT_PLACEHOLDER' | translate"
                    [rows]="3"
                    [autosize]="true"
                    [error]="errors.comment"
                />
            </div>
        </div>
    </details>
</fd-ui-card>
