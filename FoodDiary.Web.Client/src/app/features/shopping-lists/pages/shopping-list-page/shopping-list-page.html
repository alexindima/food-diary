<div class="shopping-list" fdPageContainer>
    <fd-page-header [title]="'SHOPPING_LIST.TITLE' | translate" [subtitle]="'SHOPPING_LIST.SUBTITLE' | translate" [compactActions]="true">
        <fd-ui-button
            appearance="brand-action"
            variant="primary"
            fill="solid"
            icon="add"
            data-fd-overflow-primary
            [disabled]="isCreating()"
            [disabledReason]="'DISABLED_HINTS.OPERATION_BUSY' | translate"
            (click)="createNewList()"
            >{{ 'SHOPPING_LIST.NEW_LIST_BUTTON' | translate }}</fd-ui-button
        >
        <fd-ui-button
            data-tour-id="shopping-list-tour-help"
            appearance="toolbar"
            variant="secondary"
            fill="outline"
            icon="help_outline"
            [fdUiHint]="'SHOPPING_LIST.TOUR.START_TOUR' | translate"
            [ariaLabel]="'SHOPPING_LIST.TOUR.START_TOUR' | translate"
            (click)="startShoppingListTour()"
        />
    </fd-page-header>
    <fd-page-body>
        @if (isLoading() && !hasLists()) {
            <fd-ui-loader class="shopping-list__loader" />
        } @else if (!hasLists()) {
            <section class="shopping-list__no-lists">
                <fd-ui-icon name="shopping_cart" size="xl" />
                <h2>{{ 'SHOPPING_LIST.NO_LISTS_TITLE' | translate }}</h2>
                <p>{{ 'SHOPPING_LIST.NO_LISTS_COPY' | translate }}</p>
            </section>
        } @else {
            <fd-shopping-list-manage-controls
                data-tour-id="shopping-list-manage"
                [listSelectField]="listSelectForm.id"
                [lists]="lists()"
                [initialPage]="initialPage()"
                [isLoading]="isLoading() || isSaving()"
                [canDeleteList]="canDeleteList()"
                [isMobile]="isMobileView()"
                [renameRequestedListId]="renameRequestedListId()"
                [canClearPurchased]="checkedItemsCount() > 0"
                (mergeDuplicates)="mergeDuplicates()"
                (createList)="createNewList($event)"
                (clearPurchased)="clearPurchased()"
                (clearListById)="clearListById($event)"
                (deleteListById)="deleteListById($event)"
                (renameListById)="renameListById($event.listId, $event.name)"
                (renameRequestHandled)="clearRenameRequest($event)"
            />
            <div class="shopping-list__workspace" [attr.aria-busy]="isLoading()">
                <fieldset class="shopping-list__content" [disabled]="isLoading()">
                    <fd-shopping-list-items-panel
                        data-tour-id="shopping-list-items"
                        [itemForm]="itemForm"
                        [items]="items()"
                        (itemAdd)="addItem()"
                        (itemRemove)="removeItem($event)"
                        (itemEdit)="editItem($event)"
                        (itemCheckedChange)="toggleItemChecked($event.itemId, $event.checked)"
                    />
                </fieldset>
            </div>
        }
    </fd-page-body>
</div>
