@if (draft(); as model) {
    <div class="goals-editor">
        <fd-goals-summary-card data-tour-id="goals-calories" [calories]="model.calories" [macros]="macroDrafts()" />
        <div class="goals-editor__content">
            <fd-goals-nutrition-card
                data-tour-id="goals-macros"
                [calories]="model.calories"
                [macros]="macroDrafts()"
                [preset]="model.preset"
                [presetOptions]="presetOptions()"
                (caloriesChange)="updateCalories($event)"
                (macroChange)="updateMacro($event)"
                (presetChange)="updatePreset($event)"
            />
            <div class="goals-editor__side">
                <fd-goals-side-cards
                    [water]="model.water"
                    [bodyTargets]="model.bodyTargets"
                    (waterChange)="updateWater($event)"
                    (bodyTargetChange)="updateBodyTarget($event)"
                />
            </div>
        </div>
        <fd-goals-cycling-row
            data-tour-id="goals-cycling"
            [enabled]="model.cyclingEnabled"
            [baseCalories]="model.calories"
            [dayCalories]="model.dayCalories"
            (enabledChange)="updateCycling($event)"
            (dayCaloriesChange)="updateDayCalories($event)"
        />
        @if (dirty()) {
            <fd-unsaved-changes-bar
                [message]="'GOALS_PAGE.EDITOR.UNSAVED' | translate"
                [discardLabel]="'GOALS_PAGE.EDITOR.DISCARD' | translate"
                [saveLabel]="(saving() ? 'GOALS_PAGE.STATUS_SAVING' : 'GOALS_PAGE.EDITOR.SAVE') | translate"
                [saving]="saving()"
                (discard)="discard()"
                (save)="persist()"
            />
        }
    </div>
}
