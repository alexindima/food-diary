<div class="goals" fdPageContainer>
    <fd-page-header class="goals__header" [title]="'GOALS_PAGE.TITLE' | translate" [subtitle]="'GOALS_PAGE.SUBTITLE' | translate">
        @if (saveStatusKey(); as statusKey) {
            <span
                class="goals__status fd-ui-pill fd-ui-action-text"
                [class.goals__status--saving]="isSavingGoals()"
                [class.goals__status--loading]="isLoadingGoals()"
            >
                {{ statusKey | translate }}
            </span>
        }
        <fd-ui-button
            data-tour-id="goals-tour-help"
            appearance="toolbar"
            variant="secondary"
            fill="outline"
            icon="help_outline"
            [fdUiHint]="'GOALS_PAGE.TOUR.START_TOUR' | translate"
            [ariaLabel]="'GOALS_PAGE.TOUR.START_TOUR' | translate"
            (click)="startGoalsTour()"
        />
    </fd-page-header>

    <fd-page-body>
        @if (hasLoadError()) {
            <fd-error-state (retry)="reload()" />
        } @else if (isLoadingGoals()) {
            <div class="goals__skeleton">
                <fd-skeleton-card />
                <fd-skeleton-card />
                <fd-skeleton-card />
            </div>
        } @else {
            <fd-goals-editor
                [calories]="calorieTarget()"
                [macros]="allMacroViewStates()"
                [preset]="selectedPreset()"
                [presets]="macroPresets"
                [presetOptions]="macroPresetOptions"
                [water]="waterState().value"
                [bodyTargets]="bodyTargetDraftValues()"
                [cyclingEnabled]="calorieCyclingEnabled()"
                [dayCalories]="dayCalories()"
                [saving]="isSavingGoals()"
                (save)="saveGoalsManually($event)"
            />
        }
    </fd-page-body>
</div>
