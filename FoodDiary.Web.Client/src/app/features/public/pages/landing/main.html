<fd-hero />
<div class="landing-main">
    @defer (on viewport) {
        <fd-landing-preview-tour />
    } @placeholder {
        <div class="landing-main__preview-placeholder" aria-hidden="true"></div>
    } @error {
        <div class="landing-main__preview-placeholder" data-testid="landing-preview-error" aria-hidden="true"></div>
    }
    <fd-features />
    <fd-dietologist-promo />
    <fd-landing-steps />
    <fd-landing-faq [questions]="faqItems" [guides]="seoGuides" />
</div>
