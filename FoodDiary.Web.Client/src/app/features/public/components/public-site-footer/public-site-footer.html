<footer class="public-footer">
    <div>
        <strong>Food Diary</strong>
        <p>{{ 'PUBLIC_SITE.FOOTER.DESCRIPTION' | translate }}</p>
    </div>
    <nav [attr.aria-label]="'PUBLIC_SITE.FOOTER.LABEL' | translate">
        @for (link of links(); track link.path) {
            <a [routerLink]="link.path">{{ link.label | translate }}</a>
        }
        <fd-ui-button type="button" variant="secondary" fill="text" size="sm" (click)="marketingSettingsRequested.emit()">{{
            'MARKETING_CONSENT.SETTINGS' | translate
        }}</fd-ui-button>
    </nav>
    <a [href]="`mailto:${supportEmail}`">{{ supportEmail }}</a>
</footer>
