<fd-ui-dialog size="md" bodyScrollInset="edge" [title]="'TDEE_DIALOG.TITLE' | translate" [dismissible]="!isApplying()">
    <div class="tdee-dialog fd-stack fd-gap-md" tabindex="0" role="region" [attr.aria-label]="'TDEE_DIALOG.TITLE' | translate">
        <fd-tdee-insight-dialog-summary
            [insight]="insight"
            [stateKey]="stateKey"
            [effectiveTdee]="effectiveTdee"
            [summaryKey]="summaryKey"
            [confidenceKey]="confidenceKey"
        />

        @if (insight) {
            <fd-tdee-insight-dialog-metrics [insight]="insight" [weightTrendFormatted]="weightTrendFormatted" />
        }

        <fd-tdee-insight-dialog-setup [items]="setupItems" />

        <fd-tdee-insight-dialog-hint [hintKey]="hintKey" [showSuggestion]="showSuggestion" [insight]="insight" />
        @if (applyFailed()) {
            <p role="alert" class="fd-ui-body-sm">{{ 'TDEE_CARD.APPLY_ERROR' | translate }}</p>
        }
    </div>

    <fd-tdee-insight-dialog-footer
        fdUiDialogFooter
        [showSuggestion]="showSuggestion"
        [isApplying]="isApplying()"
        (dialogClose)="close($event)"
        (suggestionApply)="applySuggestionAsync()"
    />
</fd-ui-dialog>
