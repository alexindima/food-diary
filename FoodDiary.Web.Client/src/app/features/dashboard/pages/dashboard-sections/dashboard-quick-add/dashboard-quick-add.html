<section
    class="dashboard__quick-add fd-stack fd-gap-card-profile"
    data-tour-id="dashboard-quick-add"
    [attr.aria-label]="'DASHBOARD.QUICK_ADD_ARIA' | translate"
>
    <fd-ai-input-action-bar
        mode="create"
        [isProcessing]="isAiMealSaving()"
        [clearToken]="aiMealClearToken()"
        (mealCreateRequested)="mealCreateRequested.emit($event)"
        (manualAction)="manualAdd.emit()"
    />
</section>
