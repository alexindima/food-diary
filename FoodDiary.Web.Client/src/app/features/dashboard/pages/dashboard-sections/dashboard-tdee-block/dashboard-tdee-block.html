@if (shouldRender()) {
    <div fdDashboardBlockHost class="dashboard__block dashboard__block--tdee" [state]="state()" (blockActivated)="blockClick.emit($event)">
        @if (state().inert === null) {
            <button
                class="dashboard__tdee-action"
                type="button"
                [attr.aria-label]="state().ariaLabel"
                (keydown.enter)="$event.stopPropagation()"
                (keydown.space)="$event.stopPropagation()"
            ></button>
        }
        @defer (on viewport) {
            <fd-dashboard-card-shell fdDashboardBlockContent [state]="state()">
                <fd-tdee-insight-card
                    class="dashboard__card dashboard__card--tdee"
                    [insight]="insight()"
                    [isHistorical]="isHistorical()"
                    [isLoading]="isLoading()"
                    (applyGoal)="applyGoal.emit($event)"
                />
            </fd-dashboard-card-shell>
        } @placeholder {
            <fd-ui-loader />
        } @loading (minimum 300ms) {
            <fd-ui-loader />
        }
    </div>
}
