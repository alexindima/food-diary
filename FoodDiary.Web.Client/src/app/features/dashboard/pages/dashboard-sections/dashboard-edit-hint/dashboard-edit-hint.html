<fd-notice-banner
    class="dashboard__edit-hint"
    type="info"
    [title]="'DASHBOARD.SETTINGS.TITLE' | translate"
    [message]="'DASHBOARD.SETTINGS.HINT' | translate"
    [actionLabel]="isSaving() ? ('DASHBOARD.SETTINGS.SAVING' | translate) : actionLabel()"
    [actionLoading]="isSaving()"
    (action)="save.emit()"
/>
@if (saveFailed()) {
    <p role="alert" class="fd-ui-body-sm">{{ 'DASHBOARD.SETTINGS.SAVE_ERROR' | translate }}</p>
}
