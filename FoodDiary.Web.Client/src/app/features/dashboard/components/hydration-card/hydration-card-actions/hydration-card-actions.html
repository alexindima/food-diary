@if (canAdd()) {
    <div class="hydration-card__quick-add" role="group" [attr.aria-label]="'HYDRATION_CARD.QUICK_ADD_LABEL' | translate">
        @for (amount of addAmounts; track amount) {
            <fd-ui-button
                class="hydration-card__quick-action"
                size="sm"
                variant="secondary"
                fill="outline"
                [class.hydration-card__quick-action--confirmed]="addedAmount() === amount"
                [fullWidth]="true"
                [ariaLabel]="'HYDRATION_CARD.ADD_AMOUNT' | translate: { value: amount }"
                [disabled]="isLoading()"
                [disabledReason]="isLoading() ? ('DISABLED_HINTS.OPERATION_BUSY' | translate) : null"
                (click)="addClick.emit(amount)"
            >
                +{{ amount }} {{ 'GENERAL.UNITS.ML' | translate }}
            </fd-ui-button>
        }
    </div>
} @else {
    <p class="hydration-card__selected-day-hint fd-ui-caption">{{ 'HYDRATION_CARD.SELECTED_DAY_HINT' | translate }}</p>
}
