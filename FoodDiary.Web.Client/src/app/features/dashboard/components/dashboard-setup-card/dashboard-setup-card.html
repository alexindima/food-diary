<fd-ui-card appearance="info" density="compact" role="region" [attr.aria-label]="'DASHBOARD.INITIAL_SETUP.TITLE' | translate">
    <div class="fd-stack fd-gap-xxs">
        <div class="dashboard-setup-card__header fd-row fd-align-center fd-gap-xs">
            <fd-ui-button
                class="dashboard-setup-card__dismiss"
                variant="secondary"
                fill="text"
                appearance="plain-icon"
                size="sm"
                icon="close"
                [ariaLabel]="'DASHBOARD.INITIAL_SETUP.DISMISS' | translate"
                [loading]="facade.isSaving()"
                (click)="facade.dismissAsync()"
            />
            <h2 class="dashboard-setup-card__title fd-ui-card-title">{{ 'DASHBOARD.INITIAL_SETUP.TITLE' | translate }}</h2>
        </div>
        <p class="fd-ui-body-sm fd-ui-text-muted">{{ 'DASHBOARD.INITIAL_SETUP.HINT' | translate }}</p>
    </div>
    <div class="dashboard-setup-card__actions fd-row fd-wrap fd-gap-xs">
        <fd-ui-button variant="secondary" fill="outline" size="sm" (click)="primaryAction.emit()">
            {{ primaryActionKey() | translate }}
        </fd-ui-button>
        <fd-ui-button variant="secondary" fill="text" size="sm" (click)="goalsAction.emit()">
            {{ 'DASHBOARD.INITIAL_SETUP.GOALS' | translate }}
        </fd-ui-button>
    </div>
    @if (facade.saveFailed()) {
        <p class="dashboard-setup-card__error fd-ui-body-sm" role="alert">{{ 'DASHBOARD.INITIAL_SETUP.SAVE_ERROR' | translate }}</p>
    }
</fd-ui-card>
