<div class="fasting fd-stack fd-gap-md" fdPageContainer>
    <fd-page-header class="fasting__header" [title]="'FASTING.TITLE' | translate" [subtitle]="'FASTING.SUBTITLE' | translate">
        <fd-ui-button
            data-tour-id="fasting-tour-help"
            appearance="toolbar"
            variant="secondary"
            fill="outline"
            icon="help_outline"
            [fdUiHint]="'FASTING.TOUR.START_TOUR' | translate"
            [ariaLabel]="'FASTING.TOUR.START_TOUR' | translate"
            (click)="startFastingTour()"
        />
    </fd-page-header>

    <fd-page-body>
        @if (isLoading()) {
            <div class="fasting__skeleton-grid fd-grid fd-gap-md">
                <fd-skeleton-card class="fasting__skeleton fasting__skeleton--hero" />
                <fd-skeleton-card class="fasting__skeleton fasting__skeleton--section" />
                <fd-skeleton-card class="fasting__skeleton fasting__skeleton--section" />
            </div>
        } @else {
            <fd-fasting-redesign-preview
                [session]="currentSession()"
                [stats]="stats()"
                [history]="history()"
                [elapsedFormatted]="elapsedFormatted()"
                [remainingFormatted]="remainingFormatted()"
                [progressPercent]="progressPercent()"
                [now]="now()"
                [selectedDurationHours]="plannedDurationHours()"
                [isStarting]="isStarting()"
                [alerts]="visibleAlertItems()"
                [insights]="insightItems()"
                (startRequested)="startFasting()"
                (manageRequested)="openSessionManagement()"
                (protocolSettingsRequested)="openProtocolSettings()"
                (checkInRequested)="openCheckInForm()"
                (historyRequested)="openHistory()"
                (sessionDetailsRequested)="openSessionDetails($event)"
                (alertDismissRequested)="dismissPrompt($event)"
            />
        }
    </fd-page-body>
</div>
