<fd-ui-dialog-shell size="sm" [title]="data.title">
    <div class="fasting-end-confirm-dialog__body">
        <p class="fasting-end-confirm-dialog__message fd-ui-body-sm">{{ data.message }}</p>
    </div>

    <div fdUiDialogFooter class="fasting-end-confirm-dialog__footer fd-ui-actions fd-ui-actions--end">
        <fd-ui-button variant="secondary" fill="ghost" (click)="onCancel()"> {{ data.cancelLabel }} </fd-ui-button>
        <fd-ui-button variant="primary" (click)="onConfirm()"> {{ data.confirmLabel }} </fd-ui-button>
    </div>
</fd-ui-dialog-shell>
