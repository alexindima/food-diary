<form class="waist-history-page__form fd-stack fd-gap-card-header" [formRoot]="form()">
    <div class="waist-history-page__form-row waist-history-page__form-row--compact fd-grid fd-gap-card-header">
        <fd-ui-date-input
            class="waist-history-page__form-control"
            [label]="'WAIST_HISTORY.DATE_LABEL' | translate"
            [placeholder]="'WAIST_HISTORY.DATE_PLACEHOLDER' | translate"
            [todayLabel]="'WAIST_HISTORY.TODAY' | translate"
            [formField]="form().date"
        />

        <fd-ui-input
            class="waist-history-page__form-control"
            type="number"
            [step]="0.1"
            [label]="'WAIST_HISTORY.CIRCUMFERENCE_LABEL' | translate"
            [placeholder]="'WAIST_HISTORY.CIRCUMFERENCE_PLACEHOLDER' | translate"
            [formField]="form().circumferenceCm"
        />
    </div>

    <div class="waist-history-page__form-actions fd-row fd-wrap fd-justify-end fd-gap-actions">
        @if (isEditing()) {
            <fd-ui-button type="button" variant="secondary" fill="text" (click)="editCancel.emit()">
                {{ 'WAIST_HISTORY.CANCEL_EDIT' | translate }}
            </fd-ui-button>
        }
        <fd-ui-button type="submit" [loading]="isSaving()">
            @if (isEditing()) {
                {{ 'WAIST_HISTORY.UPDATE' | translate }}
            } @else {
                {{ 'WAIST_HISTORY.ADD' | translate }}
            }
        </fd-ui-button>
    </div>
    @if (error()) {
        <fd-ui-form-error [error]="error()" />
    }
</form>
