<fd-ui-dialog
    size="sm"
    [title]="(desiredWaistCm() === null ? 'WAIST_HISTORY.SET_GOAL' : 'WAIST_HISTORY.CONFIGURE_GOAL') | translate"
    [dismissible]="!isSaving()"
    (close)="close()"
>
    <div class="fd-stack fd-gap-card-content">
        <fd-ui-input
            type="number"
            [step]="0.1"
            [label]="'WAIST_HISTORY.DESIRED_WAIST_LABEL' | translate: { unit: 'length' | measurementUnit | translate }"
            [ariaLabel]="'WAIST_HISTORY.GOAL_CARD_TITLE' | translate"
            [placeholder]="'WAIST_HISTORY.GOAL_PLACEHOLDER' | translate"
            [suffixButtonIcon]="waistField().value() ? 'backspace' : undefined"
            [formField]="waistField"
            (suffixButtonClicked)="waistField().value.set('')"
        />
        <div class="fd-row fd-wrap fd-justify-end fd-gap-actions">
            @if (desiredWaistCm() !== null) {
                <fd-ui-button type="button" variant="danger" fill="text" [loading]="isSaving()" (click)="cancelGoal()">{{
                    'WAIST_HISTORY.CANCEL_GOAL' | translate
                }}</fd-ui-button>
            }
            <fd-ui-button type="button" [loading]="isSaving()" (click)="save()">{{
                (desiredWaistCm() === null ? 'WAIST_HISTORY.SET_GOAL' : 'WAIST_HISTORY.START_NEW_GOAL') | translate
            }}</fd-ui-button>
        </div>
    </div>
</fd-ui-dialog>
