<fd-ui-dialog
    size="sm"
    [title]="(isEditing() ? 'WAIST_HISTORY.EDIT_ENTRY_TITLE' : 'WAIST_HISTORY.ADD_ENTRY_TITLE') | translate"
    [dismissible]="true"
    (close)="close()"
>
    <fd-waist-history-form-card
        data-tour-id="waist-history-entry-form"
        [form]="form"
        [isSaving]="isSaving()"
        [isEditing]="isEditing()"
        [error]="error()"
        (editCancel)="close()"
    />
</fd-ui-dialog>
