<div #container class="meal-list" fdPageContainer>
    <fd-page-header
        class="meal-list__header"
        [title]="'MEAL_LIST.TITLE' | translate"
        [subtitle]="'MEAL_LIST.SUBTITLE' | translate"
        [compactActions]="true"
    >
        @if (isMobileView()) {
            <div class="meal-list__mobile-toolbar" data-tour-id="meal-list-filters">
                <fd-ui-button
                    class="meal-list__icon-button meal-list__filter-button"
                    appearance="toolbar"
                    variant="secondary"
                    fill="outline"
                    icon="filter_alt"
                    [fdUiHint]="'MEAL_LIST.DATE_FILTER_BUTTON' | translate"
                    [ariaLabel]="'MEAL_LIST.DATE_FILTER_BUTTON' | translate"
                    [class.meal-list__filter-button--active]="hasActiveFilters()"
                    (click)="openFilters()"
                />
                <fd-ui-button
                    class="meal-list__icon-button"
                    data-tour-id="meal-list-tour-help"
                    appearance="toolbar"
                    variant="secondary"
                    fill="outline"
                    icon="help_outline"
                    [fdUiHint]="'MEAL_LIST.TOUR.START_TOUR' | translate"
                    [ariaLabel]="'MEAL_LIST.TOUR.START_TOUR' | translate"
                    (click)="startMealListTour()"
                />
            </div>
        } @else {
            <div class="meal-list__header-actions" data-tour-id="meal-list-filters">
                <fd-ui-button
                    class="meal-list__icon-button meal-list__filter-button"
                    appearance="toolbar"
                    variant="secondary"
                    fill="outline"
                    icon="filter_alt"
                    [fdUiHint]="'MEAL_LIST.DATE_FILTER_BUTTON' | translate"
                    [ariaLabel]="'MEAL_LIST.DATE_FILTER_BUTTON' | translate"
                    [class.meal-list__filter-button--active]="hasActiveFilters()"
                    (click)="openFilters()"
                />
                <fd-ui-button
                    class="meal-list__icon-button"
                    data-tour-id="meal-list-tour-help"
                    appearance="toolbar"
                    variant="secondary"
                    fill="outline"
                    icon="help_outline"
                    [fdUiHint]="'MEAL_LIST.TOUR.START_TOUR' | translate"
                    [ariaLabel]="'MEAL_LIST.TOUR.START_TOUR' | translate"
                    (click)="startMealListTour()"
                />
            </div>
        }
    </fd-page-header>

    <fd-page-body>
        @defer (on idle) {
            <fd-ai-input-action-bar
                data-tour-id="meal-list-create"
                mode="create"
                [isProcessing]="isAiMealSaving()"
                [clearToken]="aiMealClearToken()"
                (mealCreateRequested)="onAiMealCreateRequested($event)"
                (manualAction)="goToMealAddAsync()"
            >
                <fd-ui-button
                    data-tour-id="meal-list-favorites"
                    manualActions
                    variant="secondary"
                    fill="text"
                    size="sm"
                    iconSize="sm"
                    icon="star"
                    (click)="openFavoritesAsync()"
                >
                    {{ 'AI_INPUT_BAR.FAVORITES_ACTION' | translate }}
                    @if (favoriteTotalCount() > 0) {
                        <span class="meal-list__favorite-count">{{ favoriteTotalCount() }}</span>
                    }
                </fd-ui-button>
            </fd-ai-input-action-bar>
        } @placeholder {
            <div class="meal-list__ai-placeholder" aria-hidden="true"></div>
        }

        @if (hasActiveFilters()) {
            <fd-active-filters [chips]="activeFilterChips()" (filterRemoved)="removeFilter($event)" (filtersReset)="resetFilters()" />
        }

        <fd-meal-list-content
            data-tour-id="meal-list-results"
            [errorKey]="errorKey()"
            [isLoading]="mealData.isLoading()"
            [emptyState]="emptyState()"
            [plannedGroups]="plannedGroups()"
            [isPlannedOpen]="isPlannedOpen()"
            [groups]="groupedMeals()"
            [totalPages]="mealData.totalPages"
            [totalItems]="mealData.totalItems"
            [currentPageIndex]="currentPageIndex()"
            [favoriteLoadingIds]="favoriteLoadingIds()"
            (retry)="retryLoad()"
            (mealAdd)="goToMealAddAsync()"
            (plannedToggle)="togglePlanned()"
            (mealOpened)="openMealDetailsAsync($event)"
            (mealFavoriteToggle)="onMealFavoriteToggle($event)"
            (pageIndexChange)="onPageChange($event)"
        />
    </fd-page-body>
</div>
