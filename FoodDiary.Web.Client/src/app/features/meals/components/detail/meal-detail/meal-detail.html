<fd-ui-dialog size="lg">
    <header fdUiDialogHeader class="meal-detail__header">
        <div class="meal-detail__header-row">
            <div class="meal-detail__title-group">
                <fd-ui-button
                    class="meal-detail__favorite-btn fd-favorite-button fd-inline-center"
                    appearance="plain-icon"
                    variant="secondary"
                    fill="text"
                    iconSize="sm"
                    [icon]="favoriteIcon()"
                    [class.meal-detail__favorite-btn--active]="isFavorite()"
                    [class.fd-favorite-button--active]="isFavorite()"
                    [disabled]="isFavoriteLoading()"
                    [fdUiHint]="favoriteAriaLabelKey() | translate"
                    [ariaLabel]="favoriteAriaLabelKey() | translate"
                    (click)="toggleFavorite()"
                />
                <div class="meal-detail__heading">
                    <h2 class="meal-detail__title">{{ 'MEAL_DETAIL.TITLE' | translate }}</h2>
                    @if (formattedDate) {
                        <p class="meal-detail__subtitle">
                            {{ formattedDate }}
                            @if (mealTypeLabel) {
                                <span aria-hidden="true"> &middot; </span>
                                <span>{{ mealTypeLabel }}</span>
                            }
                        </p>
                    }
                </div>
            </div>
            <fd-ui-button
                appearance="plain-icon"
                variant="secondary"
                fill="text"
                icon="close"
                [ariaLabel]="'COMMON.CLOSE' | translate"
                (click)="close()"
            />
        </div>
    </header>

    <div class="meal-detail fd-stack fd-gap-lg">
        <fd-meal-detail-summary
            [meal]="meal"
            [macroSummaryBlocks]="macroSummaryBlocks()"
            [preMealSatietyMeta]="preMealSatietyMeta"
            [postMealSatietyMeta]="postMealSatietyMeta"
            [itemPreview]="itemPreview"
            [isItemPreviewExpanded]="isItemPreviewExpanded()"
            (itemPreviewExpandedToggle)="toggleItemPreviewExpanded()"
        />
    </div>

    <div fdUiDialogFooter class="meal-detail__footer fd-stack fd-gap-sm">
        <div class="meal-detail__actions fd-ui-actions fd-ui-actions--end">
            <fd-ui-button size="md" variant="secondary" icon="replay" (click)="onRepeat()">
                {{ 'MEAL_DETAIL.REPEAT_BUTTON' | translate }}
            </fd-ui-button>
            <fd-ui-button size="md" variant="secondary" icon="edit" (click)="onEdit()">
                {{ 'MEAL_DETAIL.EDIT_BUTTON' | translate }}
            </fd-ui-button>
            <fd-ui-button size="md" variant="danger" fill="text" icon="delete" (click)="onDelete()">
                {{ 'MEAL_DETAIL.DELETE_BUTTON' | translate }}
            </fd-ui-button>
        </div>
    </div>
</fd-ui-dialog>
