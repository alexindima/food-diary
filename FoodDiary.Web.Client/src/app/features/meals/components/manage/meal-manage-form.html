<div class="meal-manage fd-stack" fdPageContainer [fdUiPreventUnload]="mealSignalForm().dirty()">
    <fd-page-header
        class="meal-manage__header"
        [attr.inert]="isBusy() ? '' : null"
        [title]="manageHeaderState().titleKey | translate"
        [subtitle]="'MEAL_MANAGE.SUBTITLE' | translate"
        [backVisible]="true"
        [backAriaLabel]="'PRODUCT_MANAGE.CANCEL_BUTTON' | translate"
        (back)="onCancelAsync()"
    >
        <fd-ui-button
            appearance="toolbar"
            variant="primary"
            icon="save"
            data-fd-overflow-primary
            [ariaLabel]="(meal() !== null ? 'MEAL_MANAGE.SAVE_BUTTON' : 'MEAL_MANAGE.ADD_BUTTON') | translate"
            [fdUiHint]="(meal() !== null ? 'MEAL_MANAGE.SAVE_BUTTON' : 'MEAL_MANAGE.ADD_BUTTON') | translate"
            [disabled]="isSubmitDisabled()"
            [disabledReason]="
                (isLoadingRecipeAmounts() || photosUploading() ? 'COMMON.LOADING' : 'DISABLED_HINTS.FORM_INVALID') | translate
            "
            [loading]="isSubmitBusy()"
            (click)="manageForm.requestSubmit()"
        />
        <fd-ui-button
            data-tour-id="meal-manage-tour-help"
            appearance="toolbar"
            variant="secondary"
            fill="outline"
            icon="help_outline"
            [fdUiHint]="'MEAL_MANAGE.TOUR.START_TOUR' | translate"
            [ariaLabel]="'MEAL_MANAGE.TOUR.START_TOUR' | translate"
            (click)="startMealManageTour()"
        />
    </fd-page-header>

    <fd-page-body>
        @if (isLoadingRecipeAmounts()) {
            <div role="status" [attr.aria-label]="'COMMON.LOADING' | translate">
                <fd-ui-loader aria-hidden="true" />
            </div>
        }
        <form
            #manageForm
            method="post"
            class="meal-manage__form fd-stack fd-gap-lg"
            [formRoot]="mealSignalForm"
            [attr.aria-busy]="isBusy()"
            [style.display]="isLoadingRecipeAmounts() ? 'none' : null"
        >
            @let generalErrors = generalFieldErrors();
            <fieldset
                class="meal-manage__grid fd-grid"
                [disabled]="isBusy()"
                [attr.inert]="isBusy() ? '' : null"
                [attr.aria-label]="manageHeaderState().titleKey | translate"
            >
                <div class="meal-manage__column meal-manage__column--primary fd-stack">
                    <fd-meal-items-section
                        data-tour-id="meal-manage-items"
                        [items]="itemListItems()"
                        [itemsError]="itemsError()"
                        [aiSessions]="aiSessions()"
                        [selectedMealType]="selectedMealType()"
                        [isProcessing]="false"
                        [renderVersion]="0"
                        (mealRecognized)="onAiMealRecognized($event)"
                        (addItem)="addMealItem()"
                        (editItem)="openManualItemDialog($event)"
                        (removeItem)="removeItem($event)"
                        (openItemSelect)="onItemSourceClick($event)"
                        (editSession)="onEditAiSession($event)"
                        (deleteSession)="onDeleteAiSession($event)"
                    />

                    <fd-meal-general-info
                        data-tour-id="meal-manage-general"
                        [mealForm]="mealSignalForm"
                        [mealTypeSelectOptions]="mealTypeSelectOptions"
                        [generalErrors]="generalErrors"
                        (photosUploading)="photosUploading.set($event)"
                    />

                    <fd-meal-satiety-card
                        data-tour-id="meal-manage-satiety"
                        [preMealSatietyLevel]="preMealSatietyLevel()"
                        [postMealSatietyLevel]="postMealSatietyLevel()"
                        (preMealSatietyLevelChange)="onSatietyLevelChange('preMealSatietyLevel', $event)"
                        (postMealSatietyLevelChange)="onSatietyLevelChange('postMealSatietyLevel', $event)"
                    />
                </div>

                <div class="meal-manage__column meal-manage__column--secondary fd-stack">
                    <fd-meal-nutrition-sidebar
                        data-tour-id="meal-manage-nutrition"
                        [mealForm]="mealSignalForm"
                        [macroBarState]="macroBarState()"
                        [nutritionMode]="nutritionMode()"
                        [nutritionWarning]="nutritionWarning()"
                        [caloriesError]="caloriesError()"
                        [macrosError]="macrosError()"
                        [isEditMode]="meal() !== null"
                        [isSubmitting]="isSubmitting()"
                        [photosUploading]="photosUploading()"
                        [submitDisabled]="isSubmitDisabled()"
                        [globalError]="globalError()"
                        (nutritionModeChange)="onNutritionModeChange($event)"
                        (cancelRequested)="onCancelAsync()"
                    />
                </div>
            </fieldset>
        </form>
    </fd-page-body>
</div>
