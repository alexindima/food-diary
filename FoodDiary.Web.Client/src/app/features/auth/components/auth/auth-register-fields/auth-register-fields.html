<div class="fd-stack fd-gap-md">
    <div class="auth__field fd-stack fd-gap-xs">
        <fd-ui-input
            appearance="auth"
            type="email"
            autocomplete="username"
            enterKeyHint="next"
            id="auth-register-email"
            [formField]="form().email"
            [label]="'AUTH.REGISTER.EMAIL' | translate"
            [placeholder]="'AUTH.REGISTER.EMAIL_PLACEHOLDER' | translate"
            [error]="errors().email"
        />
    </div>
    <div class="auth__field fd-stack fd-gap-xs">
        <fd-ui-input
            appearance="auth"
            autocomplete="new-password"
            id="new-password"
            enterKeyHint="done"
            [type]="passwordInputType()"
            [maximumLength]="passwordMaximumLength"
            [formField]="form().password"
            [label]="'AUTH.REGISTER.PASSWORD' | translate"
            [placeholder]="'AUTH.REGISTER.PASSWORD_PLACEHOLDER' | translate"
            [error]="errors().password"
            [suffixButtonIcon]="passwordToggleIcon()"
            [suffixButtonAriaLabel]="passwordToggleLabelKey() | translate"
            (suffixButtonClicked)="togglePasswordVisibility()"
        />
    </div>

    <fd-ui-checkbox class="auth__terms" label="" [formField]="form().agreeTerms" [error]="errors().agreeTerms">
        <span
            class="auth__checkbox-text fd-ui-body-sm"
            [innerHTML]="'AUTH.REGISTER.AGREE_TO_TERMS' | translate: { privacyUrl: privacyUrl }"
        ></span>
    </fd-ui-checkbox>
</div>
