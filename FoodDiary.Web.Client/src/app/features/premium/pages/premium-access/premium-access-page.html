<section fdPageContainer class="premium-access-page fd-stack">
    <fd-page-header [title]="'PREMIUM_PAGE.TITLE' | translate" [subtitle]="'PREMIUM_PAGE.SUBTITLE' | translate">
        <fd-ui-button
            data-tour-id="premium-tour-help"
            appearance="toolbar"
            variant="secondary"
            fill="outline"
            icon="help_outline"
            [fdUiHint]="'PREMIUM_PAGE.TOUR.START_TOUR' | translate"
            [ariaLabel]="'PREMIUM_PAGE.TOUR.START_TOUR' | translate"
            (click)="startPremiumTour()"
        />
    </fd-page-header>

    <fd-page-body>
        <fd-premium-access-banners
            [checkoutReturnState]="checkoutReturnState()"
            [errorMessage]="errorMessage()"
            (retry)="reloadOverviewAsync()"
        />

        <fd-premium-overview-card
            data-tour-id="premium-overview"
            [viewModel]="overviewViewModel()"
            [portalLoading]="portalLoading()"
            [trialLoading]="trialLoading()"
            [isLoading]="isLoading()"
            [overview]="overview()"
            [plansAvailable]="showPlans()"
            (overviewChanged)="overview.set($event)"
            (manageBilling)="openPortalAsync()"
            (startTrial)="startTrialAsync()"
            (resumeSubscription)="showRenewalPlans()"
            (readSupport)="support.expanded.set(true)"
        />

        @if (showPlans()) {
            <fd-premium-plans-card
                #plansCard
                data-tour-id="premium-plans"
                role="region"
                tabindex="-1"
                [attr.aria-label]="'PREMIUM_PAGE.PLANS.TITLE' | translate"
                [cards]="planCards()"
                [prices]="pricing.prices()"
                [pricesLoading]="pricing.loading()"
                [pricesUnavailable]="pricing.unavailable()"
                [starsPrice]="overview()?.telegramStarsPrice ?? null"
                [preferTrial]="overviewViewModel().showStartTrial && overviewViewModel().isFreePlan"
                (retryPrices)="reloadOverviewAsync()"
                (checkout)="startCheckoutFromViewAsync($event)"
                (readTerms)="support.expanded.set(true)"
            />
        }

        <fd-premium-benefits-card data-tour-id="premium-benefits" [accessActive]="isPremium()" />

        <fd-premium-support-card #support />
    </fd-page-body>
</section>
