<fd-ui-card class="premium-access-page__card" density="profile">
    <h2 class="premium-access-page__title fd-ui-section-title">{{ 'PREMIUM_PAGE.SUPPORT.TITLE' | translate }}</h2>
    <p class="premium-access-page__text premium-access-page__text--muted fd-ui-body-sm">
        {{ 'PREMIUM_PAGE.SUPPORT.PAYMENT_HELP' | translate }}
    </p>
    <p class="premium-access-page__text fd-ui-body-sm">{{ 'PREMIUM_PAGE.SUPPORT.MANAGEMENT_HELP' | translate }}</p>
    <a class="premium-access-page__link" [href]="supportEmailHref">{{ supportEmail }}</a>
</fd-ui-card>
