@if (available()) {
    <div class="user-manage__login-method fd-row fd-gap-sm">
        <fd-ui-icon class="user-manage__login-method-icon" name="lock" />
        <div class="user-manage__login-method-info fd-stack fd-gap-xxs">
            <div class="user-manage__login-method-title">{{ 'USER_MANAGE.PASSWORD_METHOD_TITLE' | translate }}</div>
            <div class="user-manage__login-method-description fd-ui-body-sm">{{ actionState().descriptionKey | translate }}</div>
        </div>
        <div class="user-manage__login-method-action">
            <fd-ui-button type="button" size="sm" variant="secondary" fill="outline" (click)="passwordChange.emit()">
                {{ actionState().buttonLabelKey | translate }}
            </fd-ui-button>
        </div>
    </div>
}
