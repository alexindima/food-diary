<div class="admin-shell fd-grid">
    <fd-ui-sidebar
        brandTitle="FoodDiary"
        brandSubtitle="Admin"
        logoText="FD"
        [sections]="sidebarSections()"
        (sectionToggled)="onSidebarSectionToggled($event.section.id)"
    />

    <main class="admin-shell__content">
        <nav class="admin-shell__mobile-nav" [attr.aria-label]="'ADMIN_NAV.SECTIONS' | translate">
            <label for="admin-mobile-route">{{ 'ADMIN_NAV.SECTIONS' | translate }}</label>
            <select id="admin-mobile-route" [value]="currentSection()" (change)="onMobileRouteChange($event)">
                @for (item of mobileItems(); track item.id) {
                    <option [value]="item.route">{{ item.label }}</option>
                }
            </select>
        </nav>
        @if (isMailRoute()) {
            <h1 class="fd-page-title">{{ 'ADMIN_OUTGOING.MAIL' | translate }}</h1>
            <fd-ui-tabs
                [tabs]="[
                    { value: '/mail-inbox', labelKey: 'ADMIN_OUTGOING.INCOMING' },
                    { value: '/outgoing-emails', labelKey: 'ADMIN_OUTGOING.OUTGOING' },
                ]"
                [selectedValue]="currentPath()"
                (selectedValueChange)="navigateMail($event)"
            />
        } @else if (pageHeader(); as header) {
            <header class="admin-shell__page-header">
                <h1 class="fd-page-title">{{ header.title | translate }}</h1>
                <p class="fd-page-subtitle">{{ header.subtitle | translate }}</p>
            </header>
        }
        <router-outlet />
    </main>
</div>
