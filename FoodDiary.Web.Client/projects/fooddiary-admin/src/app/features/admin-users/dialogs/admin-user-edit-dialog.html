<!-- eslint-disable @angular-eslint/template/prefer-static-string-properties -- Bind control IDs to avoid duplicate host IDs and preserve label associations. -->
<fd-ui-dialog title="Edit user">
    <div class="admin-user-edit-dialog fd-grid fd-gap-md">
        <div>
            <fd-ui-checkbox label="Active" [id]="'admin-user-edit-is-active'" [formField]="form.isActive" />
        </div>

        <div>
            <fd-ui-checkbox label="Email confirmed" [id]="'admin-user-edit-is-email-confirmed'" [formField]="form.isEmailConfirmed" />
        </div>

        <div class="roles fd-grid fd-gap-xs">
            <div class="roles__title">Roles</div>
            @for (role of roles; track role) {
                <div>
                    <fd-ui-checkbox
                        [label]="role"
                        [id]="`admin-user-edit-role-${role}`"
                        [checked]="hasRole(role)"
                        (checkedChange)="toggleRole(role)"
                    />
                </div>
            }
        </div>

        <div class="fd-grid fd-gap-xxs">
            <fd-ui-select label="Language" [id]="'admin-user-edit-language'" [formField]="form.language" [options]="[...languages]" />
        </div>
    </div>

    <div fdUiDialogFooter>
        <fd-ui-button
            type="button"
            variant="secondary"
            disabledReason="Save is already in progress."
            [disabled]="isSaving()"
            (click)="close()"
        >
            Cancel
        </fd-ui-button>
        <fd-ui-button type="button" disabledReason="Save is already in progress." [disabled]="isSaving()" (click)="save()"
            >Save</fd-ui-button
        >
    </div>
</fd-ui-dialog>
