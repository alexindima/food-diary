<fd-admin-period />
<div class="fd-row fd-gap-sm fd-wrap fd-align-end">
    <fd-ui-input
        [label]="'ADMIN_ACTIVITY.provider' | translate"
        [value]="firstFilter()"
        (valueChange)="firstFilter.set($event?.toString() || '')"
    />
    <fd-ui-input
        [label]="'ADMIN_ACTIVITY.device' | translate"
        [value]="secondFilter()"
        (valueChange)="secondFilter.set($event?.toString() || '')"
    />
    <fd-ui-button (click)="loginEventsPage.set(1); applyFilters()">{{ 'ADMIN_COMMON.APPLY' | translate }}</fd-ui-button>
</div>
@if (loadFailed()) {
    <fd-admin-load-error (retry)="loadLoginEvents()" />
} @else {
    <div class="admin-users fd-grid fd-gap-md">
        <fd-admin-login-activity-section
            [search]="loginEventsSearch()"
            [isLoading]="isLoginEventsLoading()"
            [totalItems]="loginEventsTotalItems()"
            [events]="loginEvents()"
            [page]="loginEventsPage()"
            [pageSize]="pageSize"
            [totalPages]="loginEventsTotalPages()"
            (searchChange)="onLoginEventsSearchChange($event)"
            (pageChange)="goToLoginEventsPage($event)"
        />
    </div>
}
