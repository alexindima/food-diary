@let dialog = viewState();

<fd-ui-dialog size="sm" [title]="dialog.title" [disableClose]="isSubmitting()">
    <p><strong>Target:</strong> {{ data.report.targetType }} ({{ data.report.targetId }})</p>
    <p><strong>Reason:</strong> {{ data.report.reason }}</p>

    <fd-ui-textarea
        label="Admin note (optional)"
        placeholder="Add an admin note..."
        [rows]="3"
        [disabled]="isSubmitting()"
        [value]="adminNote()"
        (valueChange)="updateAdminNote($event)"
    />

    @if (actionError()) {
        <fd-ui-form-error [error]="'ADMIN_MODERATION.ACTION_ERROR' | translate" />
    }

    <div class="dialog-actions fd-row fd-justify-end fd-gap-xs">
        <fd-ui-button
            type="button"
            variant="secondary"
            fill="text"
            size="sm"
            disabledReason="Action is already in progress."
            [disabled]="isSubmitting()"
            (click)="onCancel()"
        >
            Cancel
        </fd-ui-button>
        <fd-ui-button
            type="button"
            size="sm"
            disabledReason="Action is already in progress."
            [variant]="dialog.confirmVariant"
            [disabled]="isSubmitting()"
            (click)="onConfirm()"
        >
            {{ dialog.confirmLabel }}
        </fd-ui-button>
    </div>
</fd-ui-dialog>
