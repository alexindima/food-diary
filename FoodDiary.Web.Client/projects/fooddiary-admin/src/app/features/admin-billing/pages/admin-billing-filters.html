<section class="admin-billing__filters fd-row fd-gap-sm fd-wrap">
    <fd-ui-input
        label="Search billing records"
        placeholder="Email or external ID"
        [value]="search()"
        (valueChange)="searchChange.emit(getControlTextValue($event))"
    />
    <fd-ui-input label="Provider" [value]="provider()" (valueChange)="providerChange.emit(getControlTextValue($event))" />
    <fd-ui-input label="Status" [value]="status()" (valueChange)="statusChange.emit(getControlTextValue($event))" />
    @if (activeTab() === 'payments') {
        <fd-ui-input label="Payment kind" [value]="kind()" (valueChange)="kindChange.emit(getControlTextValue($event))" />
    }
    <fd-ui-button type="button" (click)="filtersApply.emit()"> Apply </fd-ui-button>
    <fd-ui-button type="button" variant="secondary" (click)="filtersReset.emit()"> Reset </fd-ui-button>
</section>
