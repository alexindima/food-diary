<!-- eslint-disable @angular-eslint/template/prefer-static-string-properties -- Bind control IDs to avoid duplicate host IDs and preserve label associations. -->
<div class="admin-filter-bar">
    <fd-ui-input [label]="'ADMIN_COMMON.SEARCH' | translate" [value]="search()" (valueChange)="search.set($event?.toString() || '')" />
    @if (showLocale()) {
        <fd-ui-select
            [id]="'admin-catalog-filter-field-1'"
            [label]="'ADMIN_PROMPTS.LOCALE' | translate"
            [value]="locale()"
            [options]="[
                { value: '', label: ('ADMIN_COMMON.ALL' | translate) },
                { value: 'ru', label: 'Русский' },
                { value: 'en', label: 'English' },
            ]"
            (valueChange)="locale.set($event ?? '')"
        />
    }
    @if (categories().length > 0) {
        <fd-ui-select
            [id]="'admin-catalog-filter-field-2'"
            [label]="'ADMIN_CATALOG.CATEGORY' | translate"
            [value]="category()"
            [options]="[{ value: '', label: ('ADMIN_COMMON.ALL' | translate) }, ...categoryOptions()]"
            (valueChange)="category.set($event ?? '')"
        />
    }
    @if (showState()) {
        <fd-ui-select
            [id]="'admin-catalog-filter-field-3'"
            [label]="'ADMIN_CATALOG.STATE' | translate"
            [value]="state()"
            [options]="[
                { value: '', label: ('ADMIN_COMMON.ALL' | translate) },
                { value: 'active', label: (activeLabel() | translate) },
                { value: 'inactive', label: (inactiveLabel() | translate) },
            ]"
            (valueChange)="state.set($event ?? '')"
        />
    }
    <fd-ui-button (click)="apply()">{{ 'ADMIN_COMMON.APPLY' | translate }}</fd-ui-button>
</div>
