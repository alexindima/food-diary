<div class="admin-period-fields fd-row fd-wrap fd-gap-sm fd-align-end">
    <fd-ui-select [label]="label() | translate" [value]="preset()" [options]="presets()" (valueChange)="select($event)" />
    @if (preset() === 'custom') {
        <fd-ui-date-input [label]="'ADMIN_OVERVIEW.FROM' | translate" [max]="today" [(value)]="from" />
        <fd-ui-date-input [label]="'ADMIN_OVERVIEW.TO' | translate" [max]="today" [(value)]="to" />
        <fd-ui-button type="button" (click)="apply()">{{
            (inline() ? 'ADMIN_COMMON.APPLY_PERIOD' : 'ADMIN_COMMON.APPLY') | translate
        }}</fd-ui-button>
    }
</div>
<p class="admin-period-hint fd-ui-body-xs">{{ 'ADMIN_COMMON.UTC' | translate }}</p>
@if (invalid()) {
    <p class="admin-period-hint" role="alert">{{ 'ADMIN_COMMON.INVALID_PERIOD' | translate }}</p>
}
