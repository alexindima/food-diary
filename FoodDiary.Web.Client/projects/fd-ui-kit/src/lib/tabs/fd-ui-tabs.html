<div
    [attr.role]="listRole()"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-labelledby]="ariaLabelledBy()"
    [class]="`fd-ui-tabs ${appearanceClass()}`"
>
    @for (tab of tabItems(); track tab.value) {
        @if (mode() === 'navigation') {
            <a
                class="fd-ui-tabs__tab"
                [routerLink]="tab.value"
                [class.fd-ui-tabs__tab--active]="tab.selected"
                [attr.aria-current]="tab.selected ? 'page' : null"
            >
                <span class="fd-ui-tabs__label">{{ tab.labelText }}</span>
            </a>
        } @else {
            <button
                #tabButton
                type="button"
                class="fd-ui-tabs__tab"
                [attr.role]="tab.role"
                [id]="tabId(tab.value)"
                [class.fd-ui-tabs__tab--active]="tab.selected"
                [attr.aria-selected]="tab.ariaSelected"
                [attr.aria-pressed]="tab.ariaPressed"
                [attr.aria-controls]="tab.controls"
                [attr.tabindex]="tab.tabIndex"
                (click)="selectIndex($index)"
                (keydown)="onKeydown($index, $event)"
            >
                <span class="fd-ui-tabs__label">{{ tab.labelText }}</span>
            </button>
        }
    }
</div>
