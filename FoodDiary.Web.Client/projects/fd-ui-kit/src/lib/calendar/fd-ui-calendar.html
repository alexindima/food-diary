<div class="fd-ui-calendar" [class.fd-ui-calendar--embedded]="appearance() === 'embedded'">
    <div class="fd-ui-calendar__header">
        <fd-ui-button
            appearance="plain-icon"
            variant="secondary"
            fill="text"
            icon="chevron_left"
            [ariaLabel]="'CALENDAR.PREVIOUS_MONTH' | translate"
            (click)="showPreviousMonth()"
        />

        <div class="fd-ui-calendar__title">{{ monthLabel() }}</div>

        <fd-ui-button
            appearance="plain-icon"
            variant="secondary"
            fill="text"
            icon="chevron_right"
            [ariaLabel]="'CALENDAR.NEXT_MONTH' | translate"
            (click)="showNextMonth()"
        />
    </div>

    <div class="fd-ui-calendar__weekdays" aria-hidden="true">
        @for (weekday of weekdayLabels(); track weekday) {
            <span class="fd-ui-calendar__weekday">{{ weekday }}</span>
        }
    </div>

    <div class="fd-ui-calendar__grid" role="grid">
        @for (week of weeks(); track $index) {
            <div class="fd-ui-calendar__week" role="row">
                @for (cell of week; track cell.iso) {
                    <button
                        type="button"
                        class="fd-ui-calendar__day"
                        role="gridcell"
                        [class.fd-ui-calendar__day--outside]="!cell.isCurrentMonth"
                        [class.fd-ui-calendar__day--today]="cell.isToday"
                        [class.fd-ui-calendar__day--selected]="cell.isSelected"
                        [class.fd-ui-calendar__day--week-selected]="selectionMode() === 'week' && cell.isSelected"
                        [class.fd-ui-calendar__day--active]="cell.isActive"
                        [disabled]="cell.isDisabled"
                        [attr.data-date]="cell.iso"
                        [attr.tabindex]="cell.isActive ? 0 : -1"
                        [attr.aria-selected]="cell.isSelected"
                        [attr.aria-label]="cell.ariaLabel"
                        (click)="selectDate(cell.date)"
                        (keydown)="onCellKeydown($event, cell.date)"
                    >
                        <span>{{ cell.label }}</span>
                        @if (cell.markers.length > 0) {
                            <span class="fd-ui-calendar__markers" aria-hidden="true">
                                @for (marker of cell.markers; track marker.label + marker.tone) {
                                    <span
                                        class="fd-ui-calendar__marker"
                                        [class.fd-ui-calendar__marker--danger]="marker.tone === 'danger'"
                                        [class.fd-ui-calendar__marker--warning]="marker.tone === 'warning'"
                                    ></span>
                                }
                            </span>
                        }
                    </button>
                }
                @if (selectionMode() === 'week' && week[0].isSelected && selectedWeekLabel(); as label) {
                    <span class="fd-ui-calendar__selected-week-label">{{ label }}</span>
                }
            </div>
        }
    </div>
</div>
