<div
    class="fd-ui-progress-ring"
    role="progressbar"
    [attr.aria-label]="ariaLabel()"
    [attr.aria-describedby]="ariaDescribedBy()"
    [attr.aria-valuemin]="0"
    [attr.aria-valuemax]="max()"
    [attr.aria-valuenow]="ariaValue()"
    [attr.tabindex]="focusable() ? 0 : null"
>
    <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">
        <circle class="fd-ui-progress-ring__track" cx="50" cy="50" r="44" pathLength="100" />
        <circle
            class="fd-ui-progress-ring__value"
            cx="50"
            cy="50"
            r="44"
            pathLength="100"
            [attr.stroke-dasharray]="normalizedValue() + ' 100'"
        />
    </svg>
    <div class="fd-ui-progress-ring__content">
        <ng-content />
    </div>
</div>
