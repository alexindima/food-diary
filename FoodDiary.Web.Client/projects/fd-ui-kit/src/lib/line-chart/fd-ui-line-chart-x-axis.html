@if (show()) {
    <div
        class="fd-ui-line-chart__x-axis"
        aria-hidden="true"
        [class.fd-ui-line-chart__x-axis--angled]="layout() === 'angled'"
        [class.fd-ui-line-chart__x-axis--stacked]="layout() === 'stacked'"
        [class.fd-ui-line-chart__x-axis--stacked-two-lines]="layout() === 'stacked' && stackedLineCount() === 2"
        [class.fd-ui-line-chart__x-axis--stacked-three-lines]="layout() === 'stacked' && stackedLineCount() >= 3"
    >
        @for (label of labels(); track label.xPercent) {
            <span
                [class.fd-ui-line-chart__x-axis-label--start]="label.position === 'start'"
                [class.fd-ui-line-chart__x-axis-label--end]="label.position === 'end'"
                [style.left]="label.xPercent"
            >
                {{ label.label }}
            </span>
        }
    </div>
}
