<div [class]="hostClass()">
    <div class="fd-ui-date-input__control-wrap" (focusin)="onFocusIn()" (focusout)="onFocusOut()">
        @if (label()) {
            <label class="fd-ui-date-input__label" [attr.for]="id()">
                <span class="fd-ui-date-input__label-text">{{ label() }}</span>
                @if (required() && showRequiredIndicator()) {
                    <span class="fd-ui-date-input__required">*</span>
                }
            </label>
        }
        <div class="fd-ui-date-input__segment">
            <input
                #origin="cdkOverlayOrigin"
                cdkOverlayOrigin
                class="fd-ui-date-input__control"
                [attr.role]="allowManualInput() ? null : 'combobox'"
                [id]="id()"
                [type]="allowManualInput() ? 'date' : 'text'"
                [value]="allowManualInput() ? manualValue() : displayValue()"
                [attr.min]="minDate() ? (minDate() | date: 'yyyy-MM-dd') : null"
                [attr.max]="maxDate() ? (maxDate() | date: 'yyyy-MM-dd') : null"
                [disabled]="disabled()"
                [readOnly]="!allowManualInput()"
                [attr.placeholder]="placeholderAttribute()"
                [attr.aria-describedby]="fieldError() ? `${id()}-error` : null"
                [attr.aria-invalid]="fieldError() ? 'true' : null"
                [attr.aria-required]="required()"
                [attr.aria-controls]="allowManualInput() ? null : `${id()}-dialog`"
                [attr.aria-expanded]="allowManualInput() ? null : isOpen()"
                [attr.aria-haspopup]="allowManualInput() ? null : 'dialog'"
                (input)="onManualInput($event)"
                (click)="!allowManualInput() && openDatePicker()"
                (keydown)="onInputKeydown($event)"
            />
            @if (clearAriaLabel() && internalValue() !== null) {
                <button
                    type="button"
                    class="fd-ui-date-input__suffix"
                    [disabled]="disabled()"
                    [attr.aria-label]="clearAriaLabel()"
                    (click)="clearValue()"
                >
                    <fd-ui-icon name="close" />
                </button>
            }
            <button
                type="button"
                class="fd-ui-date-input__suffix"
                aria-haspopup="dialog"
                [disabled]="disabled()"
                [attr.aria-label]="pickerAriaLabel() ?? label()"
                [attr.aria-controls]="`${id()}-dialog`"
                [attr.aria-expanded]="isOpen()"
                (click)="openDatePicker()"
            >
                <fd-ui-icon name="calendar_today" />
            </button>

            <ng-template
                cdkConnectedOverlay
                cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
                [cdkConnectedOverlayOrigin]="origin"
                [cdkConnectedOverlayOpen]="isOpen()"
                [cdkConnectedOverlayHasBackdrop]="true"
                [cdkConnectedOverlayPositions]="[
                    { originX: 'start', originY: 'bottom', overlayX: 'start', overlayY: 'top', offsetY: 8 },
                    { originX: 'start', originY: 'top', overlayX: 'start', overlayY: 'bottom', offsetY: -8 },
                ]"
                (backdropClick)="closeDatePicker()"
                (detach)="closeDatePicker()"
                (overlayKeydown)="onOverlayKeydown($event)"
            >
                <div class="fd-ui-date-input__panel" tabindex="-1" [id]="`${id()}-dialog`">
                    <fd-ui-calendar
                        [locale]="language()"
                        [value]="internalValue()"
                        [displayMonth]="displayMonth()"
                        [min]="minDate()"
                        [max]="maxDate()"
                        (valueChange)="onDateSelect($event)"
                        (displayMonthChange)="onDisplayMonthChange($event)"
                    />
                </div>
            </ng-template>
        </div>
    </div>

    @if (fieldError()) {
        <div class="fd-ui-date-input__error" role="alert" [id]="`${id()}-error`">{{ fieldError() }}</div>
    }
</div>
