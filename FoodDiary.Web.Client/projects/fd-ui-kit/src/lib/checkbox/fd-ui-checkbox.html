<div class="fd-ui-checkbox">
    <input
        class="fd-ui-checkbox__input"
        type="checkbox"
        [id]="id()"
        [checked]="checkedValue"
        [disabled]="disabled()"
        [attr.aria-invalid]="error() ? 'true' : null"
        [attr.aria-describedby]="describedBy()"
        (change)="updateCheckedValue($event)"
        (blur)="touchControl()"
    />
    <label class="fd-ui-checkbox__label" [attr.for]="id()" [class.fd-ui-checkbox__label--disabled]="disabled()">
        <span class="fd-ui-checkbox__control" aria-hidden="true">
            <span class="fd-ui-checkbox__checkmark"></span>
        </span>
        <span class="fd-ui-checkbox__label-text">
            @if (label()) {
                {{ label() }}
            }
            <ng-content />
        </span>
    </label>
    @if (hint() && !error()) {
        <div class="fd-ui-checkbox__hint fd-ui-helper-text" [id]="`${id()}-hint`">{{ hint() }}</div>
    }
    @if (error()) {
        <div class="fd-ui-checkbox__error fd-ui-error-text" role="alert" [id]="`${id()}-error`">{{ error() }}</div>
    }
</div>
