<div role="radiogroup" [class]="containerClass()" [attr.aria-label]="ariaLabel() || null">
    @for (option of optionViewModels(); track option.value) {
        <button
            #optionButton
            type="button"
            class="fd-ui-segmented-toggle__item"
            role="radio"
            [value]="option.value"
            [class.is-active]="option.selected"
            [attr.aria-checked]="option.selected"
            [tabIndex]="option.tabIndex"
            (click)="select(option.value)"
            (keydown)="onKeydown(option.value, $event)"
        >
            {{ option.labelText }}
        </button>
    }
</div>
