resolver 127.0.0.11 valid=10s ipv6=off;

upstream telegram_test_api {
    zone telegram_test_api 64k;
    server api:5000 resolve;
}

upstream telegram_test_storage {
    zone telegram_test_storage 64k;
    server minio:9000 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 21m;

    # A test frontend must not be indexed or send referrers containing auth state.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors https://web.telegram.org; form-action 'self'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self' blob:; manifest-src 'self'" always;

    # Access logs must not persist OIDC codes, states or other query values.
    access_log off;

    location = /health/ready {
        proxy_pass http://telegram_test_api;
        proxy_set_header Host $host;
    }

    location ^~ /api/v1/admin {
        return 404;
    }

    location /api/ {
        proxy_pass http://telegram_test_api;
        proxy_set_header Host $host;
    }

    # Preserve the host and URI used by S3 request signatures.
    location ~ ^/(fooddiary-test-images|fooddiary-test-staging)(/|$) {
        proxy_pass http://telegram_test_storage;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location / {
        add_header Cache-Control "no-store" always;
        add_header_inherit merge;
        try_files $uri $uri/ /index.html;
    }
}
