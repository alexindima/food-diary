# Managed by FoodDiary. Keep this policy in sync with the hardened container.
/var/log/nginx/*.log {
    daily
    missingok
    rotate 14
    compress
    delaycompress
    notifempty
    create 0640 root adm
    sharedscripts
    prerotate
        if [ -d /etc/logrotate.d/httpd-prerotate ]; then \
            run-parts /etc/logrotate.d/httpd-prerotate; \
        fi
    endscript
    postrotate
        /usr/bin/docker kill --signal=USR1 fooddiary-nginx-1 > /dev/null
    endscript
}
