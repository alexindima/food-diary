name: External availability

on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'infra/observability/**'
      - '.github/workflows/external-monitoring.yml'

permissions:
  contents: read

concurrency:
  group: external-availability-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contracts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - run: python3 -m unittest discover -s infra/observability -p 'test_*.py'
      - name: Verify public probes from a GitHub-hosted runner without notifications
        run: python3 infra/observability/external_monitor.py

  public-probes:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .state/external-monitoring
          key: external-availability-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: external-availability-v1-
      - name: Check public HTTP and TLS from outside production
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 infra/observability/external_monitor.py --notify
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: always()
        with:
          path: .state/external-monitoring
          key: external-availability-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: external-observations
          path: .artifacts/external-monitoring/observation.json
          retention-days: 7
