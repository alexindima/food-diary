name: Deploy

on:
  workflow_run:
    workflows:
      - CI Tests
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

env:
  SERVER_IP: 193.109.69.58
  IMAGE_PREFIX: ghcr.io/alexindima/food-diary
  SOURCE_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: fooddiary-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Initialize deploy diagnostics
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/deploy-logs"
          : > "${RUNNER_TEMP}/deploy-logs/failure-meta.env"

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Capture commit metadata
        id: commit_meta
        shell: bash
        run: |
          set -euo pipefail
          commit_sha=$(git rev-parse --short HEAD)
          commit_subject=$(git log -1 --pretty=%s)
          commit_subject=${commit_subject//$'\r'/}
          commit_subject=${commit_subject//$'\n'/ }
          commit_subject=$(printf '%s' "$commit_subject" | sed -E 's/[[:space:]]+/ /g; s/^ //; s/ $//')
          if [ "${#commit_subject}" -gt 150 ]; then
            commit_subject="${commit_subject:0:147}..."
          fi
          echo "sha=${commit_sha}" >> "$GITHUB_OUTPUT"
          echo "subject=${commit_subject}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        id: login_ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record failure step
        if: always() && steps.login_ghcr.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "FAILED_AREA=deploy"
            echo "FAILED_TARGET=Login to GitHub Container Registry"
          } > "${RUNNER_TEMP}/deploy-logs/failure-meta.env"

      - name: Set up Docker Buildx
        id: setup_buildx
        uses: docker/setup-buildx-action@v4

      - name: Record failure step
        if: always() && steps.setup_buildx.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "FAILED_AREA=deploy"
            echo "FAILED_TARGET=Set up Docker Buildx"
          } > "${RUNNER_TEMP}/deploy-logs/failure-meta.env"

      - name: Install Cosign
        id: install_cosign
        uses: sigstore/cosign-installer@v3

      - name: Record failure step
        if: always() && steps.install_cosign.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "FAILED_AREA=deploy"
            echo "FAILED_TARGET=Install Cosign"
          } > "${RUNNER_TEMP}/deploy-logs/failure-meta.env"

      - name: Build and push API
        id: build_api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: FoodDiary.Web.Api/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/api:latest
            ${{ env.IMAGE_PREFIX }}/api:sha-${{ env.SOURCE_COMMIT_SHA }}

      - name: Record failure step
        if: always() && steps.build_api.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "FAILED_AREA=deploy"
            echo "FAILED_TARGET=Build and push API"
          } > "${RUNNER_TEMP}/deploy-logs/failure-meta.env"

      - name: Build and push Telegram Bot
        id: build_telegram_bot
        uses: docker/build-push-action@v7
        with:
          context: .
          file: FoodDiary.Telegram.Bot/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/telegram-bot:latest
            ${{ env.IMAGE_PREFIX }}/telegram-bot:sha-${{ env.SOURCE_COMMIT_SHA }}

      - name: Record failure step
        if: always() && steps.build_telegram_bot.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "FAILED_AREA=deploy"
            echo "FAILED_TARGET=Build and push Telegram Bot"
          } > "${RUNNER_TEMP}/deploy-logs/failure-meta.env"

      - name: Build and push Initializer
        id: build_initializer
        uses: docker/build-push-action@v7
        with:
          context: .
          file: FoodDiary.Initializer/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/initializer:latest
            ${{ env.IMAGE_PREFIX }}/initializer:sha-${{ env.SOURCE_COMMIT_SHA }}

      - name: Record failure step
        if: always() && steps.build_initializer.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "FAILED_AREA=deploy"
            echo "FAILED_TARGET=Build and push Initializer"
          } > "${RUNNER_TEMP}/deploy-logs/failure-meta.env"

      - name: Build and push Job Manager
        id: build_job_manager
        uses: docker/build-push-action@v7
        with:
          context: .
          file: FoodDiary.JobManager/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/job-manager:latest
            ${{ env.IMAGE_PREFIX }}/job-manager:sha-${{ env.SOURCE_COMMIT_SHA }}

      - name: Record failure step
        if: always() && steps.build_job_manager.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "FAILED_AREA=deploy"
            echo "FAILED_TARGET=Build and push Job Manager"
          } > "${RUNNER_TEMP}/deploy-logs/failure-meta.env"

      - name: Build and push Mail Relay
        id: build_mail_relay
        uses: docker/build-push-action@v7
        with:
          context: .
          file: MailRelay/FoodDiary.MailRelay.WebApi/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/mail-relay:latest
            ${{ env.IMAGE_PREFIX }}/mail-relay:sha-${{ env.SOURCE_COMMIT_SHA }}

      - name: Record failure step
        if: always() && steps.build_mail_relay.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "FAILED_AREA=deploy"
            echo "FAILED_TARGET=Build and push Mail Relay"
          } > "${RUNNER_TEMP}/deploy-logs/failure-meta.env"

      - name: Build and push Mail Relay Initializer
        id: build_mailrelay_initializer
        uses: docker/build-push-action@v7
        with:
          context: .
          file: MailRelay/FoodDiary.MailRelay.Initializer/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/mailrelay-initializer:latest
            ${{ env.IMAGE_PREFIX }}/mailrelay-initializer:sha-${{ env.SOURCE_COMMIT_SHA }}

      - name: Record failure step
        if: always() && steps.build_mailrelay_initializer.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "FAILED_AREA=deploy"
            echo "FAILED_TARGET=Build and push Mail Relay Initializer"
          } > "${RUNNER_TEMP}/deploy-logs/failure-meta.env"

      - name: Build and push Mail Inbox
        id: build_mail_inbox
        uses: docker/build-push-action@v7
        with:
          context: .
          file: MailInbox/FoodDiary.MailInbox.WebApi/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/mail-inbox:latest
            ${{ env.IMAGE_PREFIX }}/mail-inbox:sha-${{ env.SOURCE_COMMIT_SHA }}

      - name: Record failure step
        if: always() && steps.build_mail_inbox.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "FAILED_AREA=deploy"
            echo "FAILED_TARGET=Build and push Mail Inbox"
          } > "${RUNNER_TEMP}/deploy-logs/failure-meta.env"

      - name: Build and push Mail Inbox Initializer
        id: build_mailinbox_initializer
        uses: docker/build-push-action@v7
        with:
          context: .
          file: MailInbox/FoodDiary.MailInbox.Initializer/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/mailinbox-initializer:latest
            ${{ env.IMAGE_PREFIX }}/mailinbox-initializer:sha-${{ env.SOURCE_COMMIT_SHA }}

      - name: Record failure step
        if: always() && steps.build_mailinbox_initializer.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "FAILED_AREA=deploy"
            echo "FAILED_TARGET=Build and push Mail Inbox Initializer"
          } > "${RUNNER_TEMP}/deploy-logs/failure-meta.env"

      - name: Build and push Client
        id: build_client
        uses: docker/build-push-action@v7
        with:
          context: FoodDiary.Web.Client
          file: FoodDiary.Web.Client/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/client:latest
            ${{ env.IMAGE_PREFIX }}/client:sha-${{ env.SOURCE_COMMIT_SHA }}
          build-args: |
            BUILD_VERSION=${{ env.SOURCE_COMMIT_SHA }}

      - name: Record failure step
        if: always() && steps.build_client.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "FAILED_AREA=deploy"
            echo "FAILED_TARGET=Build and push Client"
          } > "${RUNNER_TEMP}/deploy-logs/failure-meta.env"

      - name: Sign and verify production images
        id: sign_images
        shell: bash
        run: |
          .github/scripts/sign-and-verify-images.sh \
            "api=${{ steps.build_api.outputs.digest }}" \
            "telegram-bot=${{ steps.build_telegram_bot.outputs.digest }}" \
            "initializer=${{ steps.build_initializer.outputs.digest }}" \
            "job-manager=${{ steps.build_job_manager.outputs.digest }}" \
            "mail-relay=${{ steps.build_mail_relay.outputs.digest }}" \
            "mailrelay-initializer=${{ steps.build_mailrelay_initializer.outputs.digest }}" \
            "mail-inbox=${{ steps.build_mail_inbox.outputs.digest }}" \
            "mailinbox-initializer=${{ steps.build_mailinbox_initializer.outputs.digest }}" \
            "client=${{ steps.build_client.outputs.digest }}"

      - name: Record failure step
        if: always() && steps.sign_images.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "FAILED_AREA=deploy"
            echo "FAILED_TARGET=Sign and verify production images"
          } > "${RUNNER_TEMP}/deploy-logs/failure-meta.env"

      - name: Setup SSH
        id: setup_ssh
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Record failure step
        if: always() && steps.setup_ssh.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "FAILED_AREA=deploy"
            echo "FAILED_TARGET=Setup SSH"
          } > "${RUNNER_TEMP}/deploy-logs/failure-meta.env"

      - name: Verify server env file
        id: verify_server_env
        run: |
          SSH_CMD="ssh -T -i ~/.ssh/id_rsa -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 root@${{ env.SERVER_IP }}"
          $SSH_CMD "test -f /etc/fooddiary/fooddiary.env"

      - name: Record failure step
        if: always() && steps.verify_server_env.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "FAILED_AREA=deploy"
            echo "FAILED_TARGET=Verify server env file"
          } > "${RUNNER_TEMP}/deploy-logs/failure-meta.env"

      - name: Deploy to server
        id: deploy_server
        run: |
          DEPLOY_IMAGE_TAG="sha-${{ env.SOURCE_COMMIT_SHA }}"
          API_IMAGE_REF="${{ env.IMAGE_PREFIX }}/api@${{ steps.build_api.outputs.digest }}"
          TELEGRAM_BOT_IMAGE_REF="${{ env.IMAGE_PREFIX }}/telegram-bot@${{ steps.build_telegram_bot.outputs.digest }}"
          INITIALIZER_IMAGE_REF="${{ env.IMAGE_PREFIX }}/initializer@${{ steps.build_initializer.outputs.digest }}"
          JOB_MANAGER_IMAGE_REF="${{ env.IMAGE_PREFIX }}/job-manager@${{ steps.build_job_manager.outputs.digest }}"
          MAIL_RELAY_IMAGE_REF="${{ env.IMAGE_PREFIX }}/mail-relay@${{ steps.build_mail_relay.outputs.digest }}"
          MAIL_RELAY_INITIALIZER_IMAGE_REF="${{ env.IMAGE_PREFIX }}/mailrelay-initializer@${{ steps.build_mailrelay_initializer.outputs.digest }}"
          MAIL_INBOX_IMAGE_REF="${{ env.IMAGE_PREFIX }}/mail-inbox@${{ steps.build_mail_inbox.outputs.digest }}"
          MAIL_INBOX_INITIALIZER_IMAGE_REF="${{ env.IMAGE_PREFIX }}/mailinbox-initializer@${{ steps.build_mailinbox_initializer.outputs.digest }}"
          CLIENT_IMAGE_REF="${{ env.IMAGE_PREFIX }}/client@${{ steps.build_client.outputs.digest }}"
          SSH_CMD="ssh -T -i ~/.ssh/id_rsa -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 root@${{ env.SERVER_IP }}"
          SCP_CMD="scp -i ~/.ssh/id_rsa -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=30"

          echo "${{ secrets.GITHUB_TOKEN }}" | $SSH_CMD "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          $SSH_CMD "mkdir -p /opt/fooddiary/nginx/sites-enabled /var/www/storybook.fooddiary.club /var/log/nginx"
          $SCP_CMD docker-compose.yml root@${{ env.SERVER_IP }}:/opt/fooddiary/docker-compose.yml
          $SCP_CMD nginx.conf root@${{ env.SERVER_IP }}:/opt/fooddiary/nginx.conf
          $SCP_CMD nginx/sites-enabled/fooddiary.club root@${{ env.SERVER_IP }}:/opt/fooddiary/nginx/sites-enabled/fooddiary.club
          $SCP_CMD nginx/sites-enabled/grafana.fooddiary.club root@${{ env.SERVER_IP }}:/opt/fooddiary/nginx/sites-enabled/grafana.fooddiary.club
          $SCP_CMD nginx/sites-enabled/mail.fooddiary.club root@${{ env.SERVER_IP }}:/opt/fooddiary/nginx/sites-enabled/mail.fooddiary.club
          $SCP_CMD nginx/sites-enabled/storybook.fooddiary.club root@${{ env.SERVER_IP }}:/opt/fooddiary/nginx/sites-enabled/storybook.fooddiary.club
          $SCP_CMD scripts/restart-mail-inbox-after-certificate-renewal.sh root@${{ env.SERVER_IP }}:/etc/letsencrypt/renewal-hooks/deploy/restart-fooddiary-mail-inbox.sh

          DEPLOY_COMMIT_SHA="${{ env.SOURCE_COMMIT_SHA }}"

          cat > "${RUNNER_TEMP}/deploy.sh" << 'SCRIPT_EOF'
          #!/bin/bash
          set -e
          lock_file=/var/lock/fooddiary-deploy.lock
          exec 9>"$lock_file"
          if ! flock -n 9; then
            echo "Another FoodDiary deploy is already running on this server."
            exit 75
          fi

          cd /opt/fooddiary

          chmod 0755 /etc/letsencrypt/renewal-hooks/deploy/restart-fooddiary-mail-inbox.sh

          cp /etc/fooddiary/fooddiary.env .env
          printf '\nAPI_IMAGE_REF=%s\nINITIALIZER_IMAGE_REF=%s\nTELEGRAM_BOT_IMAGE_REF=%s\nJOB_MANAGER_IMAGE_REF=%s\nMAIL_RELAY_IMAGE_REF=%s\nMAIL_RELAY_INITIALIZER_IMAGE_REF=%s\nMAIL_INBOX_IMAGE_REF=%s\nMAIL_INBOX_INITIALIZER_IMAGE_REF=%s\nCLIENT_IMAGE_REF=%s\nAPI_IMAGE_TAG=%s\nDEPLOY_COMMIT_SHA=%s\n' \
            "$API_IMAGE_REF" \
            "$INITIALIZER_IMAGE_REF" \
            "$TELEGRAM_BOT_IMAGE_REF" \
            "$JOB_MANAGER_IMAGE_REF" \
            "$MAIL_RELAY_IMAGE_REF" \
            "$MAIL_RELAY_INITIALIZER_IMAGE_REF" \
            "$MAIL_INBOX_IMAGE_REF" \
            "$MAIL_INBOX_INITIALIZER_IMAGE_REF" \
            "$CLIENT_IMAGE_REF" \
            "$DEPLOY_IMAGE_TAG" \
            "$DEPLOY_COMMIT_SHA" >> .env

          export API_IMAGE_TAG="$DEPLOY_IMAGE_TAG"
          export COMPOSE_PARALLEL_LIMIT="${COMPOSE_PARALLEL_LIMIT:-2}"

          docker compose --profile backend --profile full --profile mail-inbox pull

          docker compose --profile backend run -T --rm db-init update
          docker compose --profile backend run -T --rm mailrelay-db-init update
          docker compose --profile mail-inbox run -T --rm mailinbox-db-init update

          docker compose --profile backend up -d rabbitmq
          docker compose --profile backend up -d redis
          docker compose --profile backend up -d --force-recreate --no-deps mail-relay
          docker compose --profile mail-inbox up -d --force-recreate --no-deps mail-inbox
          docker compose --profile backend up -d --force-recreate --no-deps api
          docker compose --profile full up -d --force-recreate --no-deps telegram-bot
          docker compose --profile full up -d --force-recreate --no-deps job-manager

          echo "Waiting for deployed API readiness..."
          echo "Expected commit SHA: $DEPLOY_COMMIT_SHA"
          echo "Expected image tag: $DEPLOY_IMAGE_TAG"
          api_base_url="http://127.0.0.1:${API_PORT:-5000}"
          ready=""
          for _ in $(seq 1 45); do
            if ready=$(curl -fsS "${api_base_url}/health/ready"); then
              break
            fi
            sleep 4
          done

          if [ "$ready" != "Healthy" ]; then
            echo "API readiness endpoint did not report Healthy in time."
            docker compose ps api
            docker compose logs --tail=250 --timestamps api
            exit 1
          fi

          version_json=$(curl -fsS "${api_base_url}/api/v1/version")
          echo "Actual API version payload: $version_json"
          echo "$version_json" | grep -F "\"commitSha\":\"$DEPLOY_COMMIT_SHA\""
          echo "$version_json" | grep -F "\"imageTag\":\"${DEPLOY_IMAGE_TAG}\""

          id=$(docker create "$CLIENT_IMAGE_REF")
          rm -rf /var/www/fooddiary.club/*
          docker cp $id:/usr/share/nginx/html/. /var/www/fooddiary.club/
          rm -rf /var/www/admin.fooddiary.club/*
          docker cp $id:/usr/share/nginx/html-admin/. /var/www/admin.fooddiary.club/
          mkdir -p /var/www/storybook.fooddiary.club
          rm -rf /var/www/storybook.fooddiary.club/*
          docker cp $id:/usr/share/nginx/html-storybook/. /var/www/storybook.fooddiary.club/
          chmod -R a+rX /var/www/storybook.fooddiary.club
          docker rm $id
          docker compose --profile full up -d --force-recreate --no-deps nginx

          docker image prune -a --force --filter "until=24h"

          echo "Deploy completed!"
          SCRIPT_EOF

          $SCP_CMD "${RUNNER_TEMP}/deploy.sh" root@${{ env.SERVER_IP }}:/tmp/deploy.sh
          $SSH_CMD "API_IMAGE_REF='${API_IMAGE_REF}' INITIALIZER_IMAGE_REF='${INITIALIZER_IMAGE_REF}' TELEGRAM_BOT_IMAGE_REF='${TELEGRAM_BOT_IMAGE_REF}' JOB_MANAGER_IMAGE_REF='${JOB_MANAGER_IMAGE_REF}' MAIL_RELAY_IMAGE_REF='${MAIL_RELAY_IMAGE_REF}' MAIL_RELAY_INITIALIZER_IMAGE_REF='${MAIL_RELAY_INITIALIZER_IMAGE_REF}' MAIL_INBOX_IMAGE_REF='${MAIL_INBOX_IMAGE_REF}' MAIL_INBOX_INITIALIZER_IMAGE_REF='${MAIL_INBOX_INITIALIZER_IMAGE_REF}' CLIENT_IMAGE_REF='${CLIENT_IMAGE_REF}' DEPLOY_IMAGE_TAG='${DEPLOY_IMAGE_TAG}' DEPLOY_COMMIT_SHA='${DEPLOY_COMMIT_SHA}' bash /tmp/deploy.sh"

      - name: Record failure step
        if: always() && steps.deploy_server.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "FAILED_AREA=deploy"
            echo "FAILED_TARGET=Deploy to server"
          } > "${RUNNER_TEMP}/deploy-logs/failure-meta.env"

      - name: Notify Telegram (success)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_SHA: ${{ steps.commit_meta.outputs.sha }}
          COMMIT_SUBJECT: ${{ steps.commit_meta.outputs.subject }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Skipping Telegram notification: missing secrets."
            exit 0
          fi
          MESSAGE=$'✅ Deploy success\nWorkflow: Deploy\nRepo: '"${GITHUB_REPOSITORY}"$'\nBranch: '"${GITHUB_REF_NAME}"$'\nCommit: '"${COMMIT_SHA}"$'\nTitle: '"${COMMIT_SUBJECT}"$'\nActor: '"${GITHUB_ACTOR}"$'\nRun: '"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MESSAGE}" >/dev/null

      - name: Notify Telegram (failure)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_SHA: ${{ steps.commit_meta.outputs.sha }}
          COMMIT_SUBJECT: ${{ steps.commit_meta.outputs.subject }}
        run: |
          FAILED_AREA="deploy"
          FAILED_TARGET="unknown"

          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Skipping Telegram notification: missing secrets."
            exit 0
          fi

          if [ -f "${RUNNER_TEMP}/deploy-logs/failure-meta.env" ]; then
            parsed_area=$(grep '^FAILED_AREA=' "${RUNNER_TEMP}/deploy-logs/failure-meta.env" | head -n 1 | cut -d= -f2-)
            parsed_target=$(grep '^FAILED_TARGET=' "${RUNNER_TEMP}/deploy-logs/failure-meta.env" | head -n 1 | cut -d= -f2-)
            if [ -n "${parsed_area}" ]; then
              FAILED_AREA="${parsed_area}"
            fi
            if [ -n "${parsed_target}" ]; then
              FAILED_TARGET="${parsed_target}"
            fi
          fi

          REF_NAME="${GITHUB_REF_NAME}"
          if [ -z "${REF_NAME}" ] && [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            REF_NAME="${{ github.event.workflow_run.head_branch }}"
          fi
          MESSAGE=$'❌ Deploy failed\nWorkflow: Deploy\nRepo: '"${GITHUB_REPOSITORY}"$'\nBranch: '"${REF_NAME}"$'\nCommit: '"${COMMIT_SHA}"$'\nTitle: '"${COMMIT_SUBJECT}"$'\nActor: '"${GITHUB_ACTOR}"$'\nArea: '"${FAILED_AREA}"$'\nStep: '"${FAILED_TARGET}"$'\nRun: '"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MESSAGE}" >/dev/null
