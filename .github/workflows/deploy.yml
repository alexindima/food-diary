name: Deploy

on:
  workflow_run:
    workflows:
      - CI Tests
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

env:
  SERVER_IP: 193.109.69.58
  IMAGE_PREFIX: ghcr.io/alexindima/food-diary
  SOURCE_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: fooddiary-production-deploy
  cancel-in-progress: false

jobs:
  authorize:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Authorize deployment source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          master_sha=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" | jq -er '.object.sha')
          [[ "${SOURCE_COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${SOURCE_COMMIT_SHA}" != "${master_sha}" ]]; then
            echo 'Deployment source must be the current master commit.' >&2
            exit 1
          fi
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_COMMIT_SHA }}
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Prepare image matrix
        id: matrix
        run: echo "matrix=$(node .github/scripts/deploy-images.mjs matrix)" >> "$GITHUB_OUTPUT"

  build-images:
    name: Build and sign (${{ matrix.image }})
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.authorize.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_COMMIT_SHA }}
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        id: cached_builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and push production image
        id: cached_build
        continue-on-error: true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          builder: ${{ steps.cached_builder.outputs.name }}
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:sha-${{ env.SOURCE_COMMIT_SHA }}
          build-args: ${{ matrix.image == 'client' && format('BUILD_VERSION={0}', env.SOURCE_COMMIT_SHA) || '' }}
          cache-from: type=gha,scope=production-${{ matrix.image }}
          cache-to: type=gha,scope=production-${{ matrix.image }},mode=max,ignore-error=true
      - name: Classify failed production build
        id: cache_failure
        if: ${{ !cancelled() && steps.cached_build.outcome == 'failure' }}
        env:
          BUILDER_NAME: ${{ steps.cached_builder.outputs.name }}
        run: node .github/scripts/deploy-build-retry.mjs classify
      - name: Set up clean retry builder
        id: retry_builder
        if: steps.cache_failure.outputs.retry == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Retry production image without cache
        id: retry_build
        if: steps.cache_failure.outputs.retry == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          builder: ${{ steps.retry_builder.outputs.name }}
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:sha-${{ env.SOURCE_COMMIT_SHA }}
          build-args: ${{ matrix.image == 'client' && format('BUILD_VERSION={0}', env.SOURCE_COMMIT_SHA) || '' }}
          no-cache: true
      - name: Select successful image digest
        id: build
        env:
          PRIMARY_OUTCOME: ${{ steps.cached_build.outcome }}
          PRIMARY_DIGEST: ${{ steps.cached_build.outputs.digest }}
          RETRY_OUTCOME: ${{ steps.retry_build.outcome }}
          RETRY_DIGEST: ${{ steps.retry_build.outputs.digest }}
        run: node .github/scripts/deploy-build-retry.mjs select
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign and verify production images
        run: .github/scripts/sign-and-verify-images.sh "${{ matrix.image }}=${{ steps.build.outputs.digest }}"
      - name: Record verified image receipt
        run: |
          mkdir -p "${RUNNER_TEMP}/image-receipt"
          node .github/scripts/deploy-images.mjs record '${{ matrix.image }}' '${{ steps.build.outputs.digest }}' \
            > "${RUNNER_TEMP}/image-receipt/${{ matrix.image }}.json"
      - name: Upload verified image receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: production-image-${{ github.run_id }}-${{ matrix.image }}
          path: ${{ runner.temp }}/image-receipt/*.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  deploy:
    needs: [authorize, build-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      # A newer master may have arrived while the image matrix was building.
      - name: Authorize deployment source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          master_sha=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/git/ref/heads/master" | jq -er '.object.sha')
          [[ "${SOURCE_COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${SOURCE_COMMIT_SHA}" != "${master_sha}" ]]; then
            echo 'Deployment source must be the current master commit.' >&2
            exit 1
          fi
      - name: Initialize deploy diagnostics
        run: |
          mkdir -p "${RUNNER_TEMP}/deploy-logs"
          : > "${RUNNER_TEMP}/deploy-logs/failure-meta.env"
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_COMMIT_SHA }}
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Capture commit metadata
        id: commit_meta
        shell: bash
        run: |
          set -euo pipefail
          commit_sha=$(git rev-parse --short HEAD)
          commit_subject=$(git log -1 --pretty=%s)
          commit_subject=${commit_subject//$'\r'/}
          commit_subject=${commit_subject//$'\n'/ }
          commit_subject=$(printf '%s' "$commit_subject" | sed -E 's/[[:space:]]+/ /g; s/^ //; s/ $//')
          if [ "${#commit_subject}" -gt 150 ]; then
            commit_subject="${commit_subject:0:147}..."
          fi
          echo "sha=${commit_sha}" >> "$GITHUB_OUTPUT"
          echo "subject=${commit_subject}" >> "$GITHUB_OUTPUT"
      - name: Download verified image receipts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: production-image-${{ github.run_id }}-*
          path: ${{ runner.temp }}/image-receipts
          merge-multiple: true
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify complete production image manifest
        id: images
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/deploy-images.mjs collect "${RUNNER_TEMP}/image-receipts" \
            > "${RUNNER_TEMP}/image-digests.env"
          while IFS='=' read -r name digest; do
            image_name=${name//_/-}
            reference="${IMAGE_PREFIX}/${image_name}@${digest}"
            cosign verify \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml@refs/heads/master" \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$reference" >/dev/null
            echo "Verified signed image index: $reference"
          done < "${RUNNER_TEMP}/image-digests.env"
          cat "${RUNNER_TEMP}/image-digests.env" >> "$GITHUB_OUTPUT"
      - name: Record failure step
        if: always() && steps.images.outcome == 'failure'
        run: |
          {
            echo "FAILED_AREA=deploy"
            echo "FAILED_TARGET=Verify complete production image manifest"
          } > "${RUNNER_TEMP}/deploy-logs/failure-meta.env"

      - name: Setup SSH
        id: setup_ssh
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_rsa ~/.ssh/known_hosts
          test -s ~/.ssh/id_rsa
          test -s ~/.ssh/known_hosts
          ssh-keygen -F "${{ env.SERVER_IP }}" -f ~/.ssh/known_hosts >/dev/null

      - name: Record failure step
        if: always() && steps.setup_ssh.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "FAILED_AREA=deploy"
            echo "FAILED_TARGET=Setup SSH"
          } > "${RUNNER_TEMP}/deploy-logs/failure-meta.env"

      - name: Verify server env file
        id: verify_server_env
        run: |
          SSH_CMD="ssh -T -i ~/.ssh/id_rsa -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 root@${{ env.SERVER_IP }}"
          $SSH_CMD 'set -eu
          env_file=/etc/fooddiary/fooddiary.env
          test -f "$env_file"
          required="POSTGRES_PASSWORD MAIL_RELAY_POSTGRES_PASSWORD MailRelayBroker__Password MAIL_INBOX_CONTENT_API_KEY MAIL_INBOX_METADATA_API_KEY MAIL_INBOX_POSTGRES_PASSWORD MAIL_INBOX_POSTGRES_RUNTIME_PASSWORD MAIL_INBOX_STATE_API_KEY MAIL_INBOX_TRUSTED_RELAY_NETWORK"
          for name in $required; do
            if ! grep -qE "^${name}=.+$" "$env_file"; then
              echo "Required production variable is missing: $name"
              exit 1
            fi
          done

          if grep -qiE "^MailRelay__RequireMailgunWebhookSignature=[[:space:]]*(true|\"true\")[[:space:]]*$" "$env_file"; then
            if ! grep -qE "^MailRelay__MailgunWebhookSigningKey=.+$" "$env_file"; then
              echo "Mailgun ingestion requires MailRelay__MailgunWebhookSigningKey"
              exit 1
            fi
            mailgun_credential_names="MailRelay__MailgunWebhookSigningKey"
          elif grep -qiE "^MailRelay__RequireMailgunWebhookSignature=[[:space:]]*(false|\"false\")[[:space:]]*$" "$env_file"; then
            mailgun_credential_names=""
          elif grep -qE "^MailRelay__RequireMailgunWebhookSignature=" "$env_file"; then
            echo "MailRelay__RequireMailgunWebhookSignature must be true or false"
            exit 1
          else
            mailgun_credential_names=""
          fi

          credential_names="POSTGRES_PASSWORD MAIL_RELAY_POSTGRES_PASSWORD MailRelayBroker__Password $mailgun_credential_names MAIL_INBOX_CONTENT_API_KEY MAIL_INBOX_METADATA_API_KEY MAIL_INBOX_POSTGRES_PASSWORD MAIL_INBOX_POSTGRES_RUNTIME_PASSWORD MAIL_INBOX_STATE_API_KEY"
          dollar_character=$(printf "\044")
          backtick_character=$(printf "\140")
          for name in $credential_names; do
            value=$(sed -n "s/^${name}=//p" "$env_file" | tail -n 1)
            value=$(printf "%s" "$value" | tr -d "\r")
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            first_character="${value:0:1}"
            last_character="${value: -1}"
            single_quote=$(printf "\047")
            if { [ "$first_character" = "\"" ] && [ "$last_character" = "\"" ]; } || \
               { [ "$first_character" = "$single_quote" ] && [ "$last_character" = "$single_quote" ]; }; then
              value="${value:1:${#value}-2}"
              value="${value#"${value%%[![:space:]]*}"}"
              value="${value%"${value##*[![:space:]]}"}"
            fi
            if [ -z "$value" ]; then
              echo "Production variable uses an empty or quoted-empty value: $name"
              exit 1
            fi
            case "$value" in
              *"$dollar_character"*|*"$backtick_character"*)
                echo "Production credential must not use dotenv interpolation or command substitution: $name"
                exit 1
                ;;
            esac
            case "${value,,}" in
              guest|change-me-*|34525)
                echo "Production variable uses a forbidden placeholder: $name"
                exit 1
                ;;
            esac
          done

          if grep -qE "^S3__(AccessKeyId|SecretAccessKey|Region|Bucket|StagingBucket|ServiceUrl|PublicBaseUrl)=.+$" "$env_file"; then
            s3_required="S3__AccessKeyId S3__SecretAccessKey S3__Bucket S3__StagingBucket"
            for name in $s3_required; do
              if ! grep -qE "^${name}=.+$" "$env_file"; then
                echo "Configured S3 storage is missing required production variable: $name"
                exit 1
              fi
            done

            if ! grep -qE "^S3__(Region|ServiceUrl)=.+$" "$env_file"; then
              echo "Configured S3 storage requires S3__Region or S3__ServiceUrl"
              exit 1
            fi

            bucket=$(sed -n "s/^S3__Bucket=//p" "$env_file" | tail -n 1)
            staging_bucket=$(sed -n "s/^S3__StagingBucket=//p" "$env_file" | tail -n 1)
            if [ "$bucket" = "$staging_bucket" ]; then
              echo "S3__Bucket and S3__StagingBucket must be distinct"
              exit 1
            fi

            if ! grep -qE "^S3__AllowPublicImageAccess=true$" "$env_file"; then
              echo "Configured S3 storage requires S3__AllowPublicImageAccess=true"
              exit 1
            fi
          fi'

      - name: Record failure step
        if: always() && steps.verify_server_env.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "FAILED_AREA=deploy"
            echo "FAILED_TARGET=Verify server env file"
          } > "${RUNNER_TEMP}/deploy-logs/failure-meta.env"

      - name: Verify primary database baseline
        id: verify_primary_baseline
        shell: bash
        run: |
          ssh -T -i ~/.ssh/id_rsa -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 root@${{ env.SERVER_IP }} \
            'cd /opt/fooddiary && python3 -' < scripts/database/check_primary_baseline_readiness.py

      - name: Record failure step
        if: always() && steps.verify_primary_baseline.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "FAILED_AREA=deploy"
            echo "FAILED_TARGET=Verify primary database baseline"
          } > "${RUNNER_TEMP}/deploy-logs/failure-meta.env"

      - name: Deploy to server
        id: deploy_server
        run: |
          DEPLOY_IMAGE_TAG="sha-${{ env.SOURCE_COMMIT_SHA }}"
          API_IMAGE_REF="${{ env.IMAGE_PREFIX }}/api@${{ steps.images.outputs.api }}"
          TELEGRAM_BOT_IMAGE_REF="${{ env.IMAGE_PREFIX }}/telegram-bot@${{ steps.images.outputs.telegram_bot }}"
          INITIALIZER_IMAGE_REF="${{ env.IMAGE_PREFIX }}/initializer@${{ steps.images.outputs.initializer }}"
          JOB_MANAGER_IMAGE_REF="${{ env.IMAGE_PREFIX }}/job-manager@${{ steps.images.outputs.job_manager }}"
          MAIL_RELAY_IMAGE_REF="${{ env.IMAGE_PREFIX }}/mail-relay@${{ steps.images.outputs.mail_relay }}"
          MAIL_RELAY_INITIALIZER_IMAGE_REF="${{ env.IMAGE_PREFIX }}/mailrelay-initializer@${{ steps.images.outputs.mailrelay_initializer }}"
          MAIL_INBOX_IMAGE_REF="${{ env.IMAGE_PREFIX }}/mail-inbox@${{ steps.images.outputs.mail_inbox }}"
          MAIL_INBOX_POSTGRES_TLS_INIT_IMAGE_REF="${{ env.IMAGE_PREFIX }}/mailinbox-postgres-tls-init@${{ steps.images.outputs.mailinbox_postgres_tls_init }}"
          MAIL_INBOX_INITIALIZER_IMAGE_REF="${{ env.IMAGE_PREFIX }}/mailinbox-initializer@${{ steps.images.outputs.mailinbox_initializer }}"
          CLIENT_IMAGE_REF="${{ env.IMAGE_PREFIX }}/client@${{ steps.images.outputs.client }}"
          TECH_RADAR_IMAGE_REF="${{ env.IMAGE_PREFIX }}/tech-radar@${{ steps.images.outputs.tech_radar }}"
          SSH_CMD="ssh -T -i ~/.ssh/id_rsa -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=6 root@${{ env.SERVER_IP }}"
          SCP_CMD="scp -i ~/.ssh/id_rsa -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ConnectTimeout=30"

          echo "${{ secrets.GITHUB_TOKEN }}" | $SSH_CMD "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          $SSH_CMD "mkdir -p /opt/fooddiary/nginx/sites-enabled /opt/fooddiary/Services/MailInbox/FoodDiary.MailInbox.WebApi /opt/fooddiary/scripts/deploy /var/www/storybook.fooddiary.club /var/log/nginx"
          $SCP_CMD docker-compose.yml root@${{ env.SERVER_IP }}:/opt/fooddiary/docker-compose.yml
          $SSH_CMD "install -d -m 0700 /opt/fooddiary/bugtriage"
          $SCP_CMD Services/BugTriage/deployment/compose.yml Services/BugTriage/deployment/deploy.py root@${{ env.SERVER_IP }}:/opt/fooddiary/bugtriage/
          $SCP_CMD Services/MailInbox/FoodDiary.MailInbox.WebApi/mailinbox-pg_hba.conf root@${{ env.SERVER_IP }}:/opt/fooddiary/Services/MailInbox/FoodDiary.MailInbox.WebApi/mailinbox-pg_hba.conf
          $SCP_CMD nginx.conf root@${{ env.SERVER_IP }}:/opt/fooddiary/nginx.conf
          $SCP_CMD nginx/sites-enabled/fooddiary.club root@${{ env.SERVER_IP }}:/opt/fooddiary/nginx/sites-enabled/fooddiary.club
          $SCP_CMD nginx/sites-enabled/grafana.fooddiary.club root@${{ env.SERVER_IP }}:/opt/fooddiary/nginx/sites-enabled/grafana.fooddiary.club
          $SCP_CMD nginx/sites-enabled/mail.fooddiary.club root@${{ env.SERVER_IP }}:/opt/fooddiary/nginx/sites-enabled/mail.fooddiary.club
          $SCP_CMD nginx/sites-enabled/storybook.fooddiary.club root@${{ env.SERVER_IP }}:/opt/fooddiary/nginx/sites-enabled/storybook.fooddiary.club
          $SCP_CMD nginx/sites-enabled/techradar.fooddiary.club root@${{ env.SERVER_IP }}:/opt/fooddiary/nginx/sites-enabled/techradar.fooddiary.club
          $SCP_CMD scripts/bootstrap-tech-radar-tls.sh root@${{ env.SERVER_IP }}:/opt/fooddiary/scripts/bootstrap-tech-radar-tls.sh
          $SCP_CMD scripts/deploy/publish_frontend.py root@${{ env.SERVER_IP }}:/opt/fooddiary/scripts/deploy/publish_frontend.py
          $SCP_CMD scripts/deploy/parallel_tasks.sh root@${{ env.SERVER_IP }}:/opt/fooddiary/scripts/deploy/parallel_tasks.sh
          $SCP_CMD scripts/deploy/configure_forwarded_proxy.py root@${{ env.SERVER_IP }}:/opt/fooddiary/scripts/deploy/configure_forwarded_proxy.py
          $SCP_CMD scripts/deploy/install_nginx_logrotate.py scripts/deploy/nginx-logrotate.conf root@${{ env.SERVER_IP }}:/opt/fooddiary/scripts/deploy/
          $SCP_CMD scripts/restart-mail-inbox-after-certificate-renewal.sh root@${{ env.SERVER_IP }}:/etc/letsencrypt/renewal-hooks/deploy/restart-fooddiary-mail-inbox.sh

          DEPLOY_COMMIT_SHA="${{ env.SOURCE_COMMIT_SHA }}"

          cat > "${RUNNER_TEMP}/deploy.sh" << 'SCRIPT_EOF'
          #!/bin/bash
          set -e
          lock_file=/var/lock/fooddiary-deploy.lock
          exec 9>"$lock_file"
          if ! flock -n 9; then
            echo "Another FoodDiary deploy is already running on this server."
            exit 75
          fi

          cd /opt/fooddiary

          # Reject an unreviewed host policy before stopping any database writers.
          python3 scripts/deploy/install_nginx_logrotate.py
          logrotate --debug /etc/logrotate.d/nginx >/dev/null

          chmod 0755 /etc/letsencrypt/renewal-hooks/deploy/restart-fooddiary-mail-inbox.sh
          chmod 0755 /opt/fooddiary/scripts/bootstrap-tech-radar-tls.sh

          cp /etc/fooddiary/fooddiary.env .env
          printf '\nAPI_IMAGE_REF=%s\nINITIALIZER_IMAGE_REF=%s\nTELEGRAM_BOT_IMAGE_REF=%s\nJOB_MANAGER_IMAGE_REF=%s\nMAIL_RELAY_IMAGE_REF=%s\nMAIL_RELAY_INITIALIZER_IMAGE_REF=%s\nMAIL_INBOX_IMAGE_REF=%s\nMAIL_INBOX_POSTGRES_TLS_INIT_IMAGE_REF=%s\nMAIL_INBOX_INITIALIZER_IMAGE_REF=%s\nCLIENT_IMAGE_REF=%s\nTECH_RADAR_IMAGE_REF=%s\nAPI_IMAGE_TAG=%s\nDEPLOY_COMMIT_SHA=%s\n' \
            "$API_IMAGE_REF" \
            "$INITIALIZER_IMAGE_REF" \
            "$TELEGRAM_BOT_IMAGE_REF" \
            "$JOB_MANAGER_IMAGE_REF" \
            "$MAIL_RELAY_IMAGE_REF" \
            "$MAIL_RELAY_INITIALIZER_IMAGE_REF" \
            "$MAIL_INBOX_IMAGE_REF" \
            "$MAIL_INBOX_POSTGRES_TLS_INIT_IMAGE_REF" \
            "$MAIL_INBOX_INITIALIZER_IMAGE_REF" \
            "$CLIENT_IMAGE_REF" \
            "$TECH_RADAR_IMAGE_REF" \
            "$DEPLOY_IMAGE_TAG" \
            "$DEPLOY_COMMIT_SHA" >> .env

          export API_IMAGE_TAG="$DEPLOY_IMAGE_TAG"
          export COMPOSE_PARALLEL_LIMIT="${COMPOSE_PARALLEL_LIMIT:-2}"

          # Resolve the current bridge before stopping writers; fail closed on an unknown topology.
          python3 scripts/deploy/configure_forwarded_proxy.py

          docker compose --profile backend --profile full --profile mail-inbox pull

          bash -n scripts/deploy/parallel_tasks.sh
          task_logs=$(umask 077; mktemp -d "/tmp/fooddiary-deploy-${DEPLOY_COMMIT_SHA}.XXXXXX")
          export FOODDIARY_INITIALIZER_LOCK="$task_logs/initializer.lock"
          export FOODDIARY_MAIN_MIGRATED="$task_logs/main-migrated"
          auxiliary_pid=""
          id=""
          finish_deployment() {
            status=$?
            trap - EXIT
            # Release initializer waiters on both success and failure. Without the
            # success marker they fail before any auxiliary database mutation.
            exec 8>&-
            if [ -n "$auxiliary_pid" ]; then
              if ! wait "$auxiliary_pid"; then
                if [ "$status" -eq 0 ]; then status=1; fi
              fi
            fi
            if [ -n "$id" ]; then docker rm "$id" >/dev/null 2>&1 || true; fi
            if [ "$status" -eq 0 ]; then
              rm -f -- "$task_logs"/*.log "$FOODDIARY_INITIALIZER_LOCK" "$FOODDIARY_MAIN_MIGRATED"
              rmdir "$task_logs"
            else
              echo "Private deployment task logs retained at: $task_logs" >&2
            fi
            exit "$status"
          }
          trap finish_deployment EXIT
          trap 'exit 143' TERM
          trap 'exit 130' INT
          trap 'exit 129' HUP

          deploy_initializer() {
            flock "$FOODDIARY_INITIALIZER_LOCK" bash -e -c \
              'test -f "$FOODDIARY_MAIN_MIGRATED"; exec "$@"' -- "$@"
          }
          deploy_mailrelay() {
            deploy_initializer docker compose --profile backend run -T --rm mailrelay-db-init update
            docker compose --profile backend up -d --force-recreate --no-deps mail-relay
          }
          deploy_mailinbox() {
            docker compose --profile mail-inbox up -d mailinbox-postgres
            deploy_initializer docker compose --profile mail-inbox run -T --rm mailinbox-db-init update
            docker compose --profile mail-inbox up -d --force-recreate --no-deps mail-inbox
          }
          deploy_bugtriage() {
            deploy_initializer python3 /opt/fooddiary/bugtriage/deploy.py '${{ env.IMAGE_PREFIX }}/bugtriage@${{ steps.images.outputs.bugtriage }}'
          }
          deploy_tech_radar() {
            docker compose --profile full up -d --force-recreate --no-deps tech-radar
            echo "Waiting for Technology Radar readiness..."
            for _ in $(seq 1 20); do
              if curl -fsS "http://127.0.0.1:${TECH_RADAR_PORT:-4210}/" >/dev/null; then
                return 0
              fi
              sleep 2
            done
            docker compose ps tech-radar
            docker compose logs --tail=100 --timestamps tech-radar
            return 1
          }
          export -f deploy_initializer deploy_mailrelay deploy_mailinbox deploy_bugtriage deploy_tech_radar

          # Keep the small host to one initializer, including the primary one.
          # Background workers must not inherit this lock's descriptor.
          exec 8>"$FOODDIARY_INITIALIZER_LOCK"
          flock 8
          docker compose --profile backend up -d rabbitmq redis
          bash scripts/deploy/parallel_tasks.sh "$task_logs" 2 \
            deploy_tech_radar deploy_mailrelay deploy_mailinbox deploy_bugtriage 8>&- &
          auxiliary_pid=$!

          # The Users split migration requires a coordinated release of every primary DB writer.
          backup_dir=/var/backups/fooddiary
          install -d -m 0700 "$backup_dir"
          backup_file="$backup_dir/predeploy-$(date -u +%Y%m%dT%H%M%SZ)-${DEPLOY_COMMIT_SHA}-main.dump"
          docker compose --profile backend --profile full stop --timeout 60 api telegram-bot job-manager
          if ! (
            umask 077
            docker compose exec -T postgres sh -c 'exec pg_dump --format=custom --username "$POSTGRES_USER" "$POSTGRES_DB"' < /dev/null > "$backup_file" &&
              test -s "$backup_file" &&
              docker compose exec -T postgres pg_restore --list < "$backup_file" > /dev/null
          ); then
            echo "Pre-migration backup failed; restarting the existing writers without changing the schema."
            docker compose --profile backend --profile full start api telegram-bot job-manager
            exit 1
          fi
          echo "Verified pre-migration database backup: $backup_file"

          docker compose --profile backend run -T --rm db-init update
          (umask 077; : > "$FOODDIARY_MAIN_MIGRATED")
          exec 8>&-
          docker compose --profile backend up -d --force-recreate --no-deps api
          docker compose --profile full up -d --force-recreate --no-deps telegram-bot
          docker compose --profile full up -d --force-recreate --no-deps job-manager

          echo "Waiting for deployed API readiness..."
          echo "Expected commit SHA: $DEPLOY_COMMIT_SHA"
          echo "Expected image tag: $DEPLOY_IMAGE_TAG"
          api_base_url="http://127.0.0.1:${API_PORT:-5000}"
          ready=""
          for _ in $(seq 1 45); do
            if ready=$(curl -fsS "${api_base_url}/health/ready"); then
              break
            fi
            sleep 4
          done

          if [ "$ready" != "Healthy" ]; then
            echo "API readiness endpoint did not report Healthy in time."
            docker compose ps api
            docker compose logs --tail=250 --timestamps api
            exit 1
          fi

          version_json=$(curl -fsS "${api_base_url}/internal/version")
          echo "Actual API version payload: $version_json"
          echo "$version_json" | grep -F "\"commitSha\":\"$DEPLOY_COMMIT_SHA\""
          echo "$version_json" | grep -F "\"imageTag\":\"${DEPLOY_IMAGE_TAG}\""

          # API recovery does not wait for auxiliary services, but publication does.
          wait "$auxiliary_pid"
          auxiliary_pid=""

          # Publish assets before SSR can return HTML referencing the new image.
          # TemporaryDirectory removes only its own extraction; releases remain.
          id=$(docker create "$CLIENT_IMAGE_REF")
          python3 - "$id" "$CLIENT_IMAGE_REF" <<'PYTHON_EOF'
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          container, image_reference = sys.argv[1:]
          release_id = "sha256-" + image_reference.rpartition("@sha256:")[2]
          with tempfile.TemporaryDirectory(prefix="fooddiary-frontend-") as temporary:
              for image_path, site, flags in (
                  ("html", "fooddiary.club", ["--require-ngsw"]),
                  ("html-admin", "admin.fooddiary.club", []),
              ):
                  source = Path(temporary) / site
                  source.mkdir()
                  subprocess.run(["docker", "cp", f"{container}:/usr/share/nginx/{image_path}/.", str(source)], check=True)
                  subprocess.run([
                      "python3", "/opt/fooddiary/scripts/deploy/publish_frontend.py", "publish",
                      "--source", str(source), "--root", f"/var/www/{site}",
                      "--release-id", release_id, *flags,
                  ], check=True)
          PYTHON_EOF

          docker compose --profile full up -d --force-recreate --no-deps client-ssr
          for _ in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:4000/health/ssr" >/dev/null; then
              recipe_ssr_ready=true
              break
            fi
            sleep 2
          done
          if [ "${recipe_ssr_ready:-false}" != "true" ]; then
            docker compose logs --tail=100 --timestamps client-ssr
            exit 1
          fi

          mkdir -p /var/www/storybook.fooddiary.club
          rm -rf /var/www/storybook.fooddiary.club/*
          docker cp $id:/usr/share/nginx/html-storybook/. /var/www/storybook.fooddiary.club/
          chmod -R a+rX /var/www/storybook.fooddiary.club
          docker rm "$id"
          id=""

          # The hardened container drops DAC_OVERRIDE. Keep existing host log
          # files owned by root so nginx can open them after every recreate.
          install -d -m 0755 /var/log/nginx
          find /var/log/nginx -maxdepth 1 -type f -exec chown root {} +
          find /var/log/nginx -maxdepth 1 -type f -exec chmod 0640 {} +
          docker compose --profile full up -d --force-recreate --no-deps nginx

          echo "Waiting for Nginx readiness..."
          nginx_ready=false
          for _ in $(seq 1 20); do
            if curl -fsS --resolve fooddiary.club:443:127.0.0.1 https://fooddiary.club/ >/dev/null; then
              nginx_ready=true
              break
            fi
            sleep 2
          done
          if [ "$nginx_ready" != "true" ]; then
            docker compose ps nginx
            docker compose logs --tail=100 --timestamps nginx
            exit 1
          fi

          # An invalid code must reach SSO validation (401), not fail origin validation (403).
          admin_sso_status=$(curl -sS --output /dev/null --write-out '%{http_code}' \
            --resolve admin.fooddiary.club:443:127.0.0.1 \
            --header 'Origin: https://admin.fooddiary.club' \
            --header 'X-FoodDiary-Client: admin' \
            --header 'X-Requested-With: XMLHttpRequest' \
            --header 'Content-Type: application/json' \
            --data '{"code":"deployment-origin-probe"}' \
            https://admin.fooddiary.club/api/v1/auth/admin-sso/exchange)
          if [ "$admin_sso_status" != "401" ]; then
            echo "Admin HTTPS SSO origin check failed (HTTP $admin_sso_status; expected invalid-code HTTP 401)."
            exit 1
          fi

          docker image prune -a --force --filter "until=24h"

          echo "Deploy completed!"
          SCRIPT_EOF

          $SCP_CMD "${RUNNER_TEMP}/deploy.sh" root@${{ env.SERVER_IP }}:/tmp/deploy.sh
          $SSH_CMD "API_IMAGE_REF='${API_IMAGE_REF}' INITIALIZER_IMAGE_REF='${INITIALIZER_IMAGE_REF}' TELEGRAM_BOT_IMAGE_REF='${TELEGRAM_BOT_IMAGE_REF}' JOB_MANAGER_IMAGE_REF='${JOB_MANAGER_IMAGE_REF}' MAIL_RELAY_IMAGE_REF='${MAIL_RELAY_IMAGE_REF}' MAIL_RELAY_INITIALIZER_IMAGE_REF='${MAIL_RELAY_INITIALIZER_IMAGE_REF}' MAIL_INBOX_IMAGE_REF='${MAIL_INBOX_IMAGE_REF}' MAIL_INBOX_POSTGRES_TLS_INIT_IMAGE_REF='${MAIL_INBOX_POSTGRES_TLS_INIT_IMAGE_REF}' MAIL_INBOX_INITIALIZER_IMAGE_REF='${MAIL_INBOX_INITIALIZER_IMAGE_REF}' CLIENT_IMAGE_REF='${CLIENT_IMAGE_REF}' TECH_RADAR_IMAGE_REF='${TECH_RADAR_IMAGE_REF}' DEPLOY_IMAGE_TAG='${DEPLOY_IMAGE_TAG}' DEPLOY_COMMIT_SHA='${DEPLOY_COMMIT_SHA}' bash /tmp/deploy.sh"

      - name: Record failure step
        if: always() && steps.deploy_server.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "FAILED_AREA=deploy"
            echo "FAILED_TARGET=Deploy to server"
          } > "${RUNNER_TEMP}/deploy-logs/failure-meta.env"

      - name: Notify Telegram (success)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_SHA: ${{ steps.commit_meta.outputs.sha }}
          COMMIT_SUBJECT: ${{ steps.commit_meta.outputs.subject }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Skipping Telegram notification: missing secrets."
            exit 0
          fi
          MESSAGE=$'✅ Deploy success\nWorkflow: Deploy\nRepo: '"${GITHUB_REPOSITORY}"$'\nBranch: '"${GITHUB_REF_NAME}"$'\nCommit: '"${COMMIT_SHA}"$'\nTitle: '"${COMMIT_SUBJECT}"$'\nActor: '"${GITHUB_ACTOR}"$'\nRun: '"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MESSAGE}" >/dev/null

      - name: Notify Telegram (failure)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_SHA: ${{ steps.commit_meta.outputs.sha }}
          COMMIT_SUBJECT: ${{ steps.commit_meta.outputs.subject }}
        run: |
          FAILED_AREA="deploy"
          FAILED_TARGET="unknown"

          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Skipping Telegram notification: missing secrets."
            exit 0
          fi

          if [ -f "${RUNNER_TEMP}/deploy-logs/failure-meta.env" ]; then
            parsed_area=$(grep '^FAILED_AREA=' "${RUNNER_TEMP}/deploy-logs/failure-meta.env" | head -n 1 | cut -d= -f2-)
            parsed_target=$(grep '^FAILED_TARGET=' "${RUNNER_TEMP}/deploy-logs/failure-meta.env" | head -n 1 | cut -d= -f2-)
            if [ -n "${parsed_area}" ]; then
              FAILED_AREA="${parsed_area}"
            fi
            if [ -n "${parsed_target}" ]; then
              FAILED_TARGET="${parsed_target}"
            fi
          fi

          REF_NAME="${GITHUB_REF_NAME}"
          if [ -z "${REF_NAME}" ] && [ "${GITHUB_EVENT_NAME}" = "workflow_run" ]; then
            REF_NAME="${{ github.event.workflow_run.head_branch }}"
          fi
          MESSAGE=$'❌ Deploy failed\nWorkflow: Deploy\nRepo: '"${GITHUB_REPOSITORY}"$'\nBranch: '"${REF_NAME}"$'\nCommit: '"${COMMIT_SHA}"$'\nTitle: '"${COMMIT_SUBJECT}"$'\nActor: '"${GITHUB_ACTOR}"$'\nArea: '"${FAILED_AREA}"$'\nStep: '"${FAILED_TARGET}"$'\nRun: '"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MESSAGE}" >/dev/null


  notify-build-failure:
    needs: [authorize, build-images]
    if: always() && (needs.authorize.result == 'failure' || needs.build-images.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Notify Telegram about image build failure
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTHORIZATION_RESULT: ${{ needs.authorize.result }}
          IMAGE_BUILD_RESULT: ${{ needs.build-images.result }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN}" ] || [ -z "${TELEGRAM_CHAT_ID}" ]; then
            echo "Skipping Telegram notification: missing secrets."
            exit 0
          fi
          MESSAGE=$'❌ Deploy image preparation failed\nCommit: '"${SOURCE_COMMIT_SHA}"$'\nAuthorization: '"${AUTHORIZATION_RESULT}"$'\nImages: '"${IMAGE_BUILD_RESULT}"$'\nRun: '"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${MESSAGE}" >/dev/null
