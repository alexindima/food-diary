groups:
- name: fooddiary-api-availability-slo
  interval: 30s
  rules:
  - alert: FoodDiaryApiAvailabilityBudgetFastBurn
    expr: (fooddiary:api_error_ratio_1h > 14.4 * 0.001) and (fooddiary:api_error_ratio_5m
      > 14.4 * 0.001) and on() (fooddiary:api_eligible_requests_5m > 10)
    labels:
      severity: critical
      service: api
    annotations:
      summary: FoodDiary API is rapidly consuming its 99.9% availability budget.
      runbook: docs/backend/BACKEND_RUNBOOKS.md
  - alert: FoodDiaryApiAvailabilityBudgetSlowBurn
    expr: (fooddiary:api_error_ratio_6h > 6 * 0.001) and (fooddiary:api_error_ratio_30m
      > 6 * 0.001) and on() (sum(increase(fooddiary_api_requests_total{exported_job="FoodDiary.Web.Api",url_path=~"/api/.*",url_path!~"/api/v[^/]+/auth/telegram/bot/operations/.*|/api/v[^/]+/logs",http_response_status_code!~"4.."}[30m]))
      > 50)
    labels:
      severity: warning
      service: api
    annotations:
      summary: FoodDiary API is steadily consuming its 99.9% availability budget.
      runbook: docs/backend/BACKEND_RUNBOOKS.md
