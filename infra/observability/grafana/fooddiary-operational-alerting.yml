apiVersion: 1
groups:
- orgId: 1
  name: FoodDiary Operational Coverage
  folder: Infrastructure
  interval: 1m
  rules:
  - uid: fd-api-user-errors
    title: User API errors exceed 2%
    condition: C
    data:
    - refId: A
      datasourceUid: cfhlwwx2t4w00a
      relativeTimeRange:
        from: 900
        to: 0
      model:
        datasource:
          type: prometheus
          uid: cfhlwwx2t4w00a
        expr: (fooddiary:api_error_ratio_5m > bool 0.02) and on() (fooddiary:api_eligible_requests_5m
          >= 10)
        instant: true
        range: false
        refId: A
        editorMode: code
        queryType: instant
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        type: threshold
        expression: B
        refId: C
        conditions:
        - evaluator:
            type: gt
            params:
            - 0
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
          type: query
    noDataState: OK
    execErrState: Error
    for: 5m
    isPaused: false
    labels:
      severity: critical
      service: api
    annotations:
      summary: User API errors exceed 2%
      runbook: infra/observability/README.md
  - uid: fd-api-user-slow
    title: User read API p95 exceeds 1500 ms
    condition: C
    data:
    - refId: A
      datasourceUid: cfhlwwx2t4w00a
      relativeTimeRange:
        from: 900
        to: 0
      model:
        datasource:
          type: prometheus
          uid: cfhlwwx2t4w00a
        expr: histogram_quantile(0.95, sum by(le) (rate(fooddiary_api_request_duration_milliseconds_bucket{exported_job="FoodDiary.Web.Api",url_path=~"/api/.*",url_path!~"/api/v[^/]+/auth/telegram/bot/operations/.*|/api/v[^/]+/logs",http_response_status_code!~"4..",url_path=~".*/(products|recipes|meals|dashboard).*"}[10m])))
          and on() (sum(increase(fooddiary_api_request_duration_milliseconds_count{exported_job="FoodDiary.Web.Api",url_path=~"/api/.*",url_path!~"/api/v[^/]+/auth/telegram/bot/operations/.*|/api/v[^/]+/logs",http_response_status_code!~"4..",url_path=~".*/(products|recipes|meals|dashboard).*"}[10m]))
          >= 20)
        instant: true
        range: false
        refId: A
        editorMode: code
        queryType: instant
    - refId: B
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        type: reduce
        expression: A
        reducer: last
        refId: B
    - refId: C
      datasourceUid: __expr__
      relativeTimeRange:
        from: 0
        to: 0
      model:
        type: threshold
        expression: B
        refId: C
        conditions:
        - evaluator:
            type: gt
            params:
            - 1500
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            type: last
            params: []
          type: query
    noDataState: OK
    execErrState: Error
    for: 10m
    isPaused: false
    labels:
      severity: warning
      service: api
    annotations:
      summary: User read API p95 exceeds 1500 ms
      runbook: infra/observability/README.md
