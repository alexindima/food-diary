[mcp_servers.fooddiary_development]
command = "dotnet"
args = ["run", "--project", "FoodDiary.Development.Mcp/FoodDiary.Development.Mcp.csproj", "--no-launch-profile"]
cwd = "."
startup_timeout_sec = 60
tool_timeout_sec = 150
enabled = true
required = false
enabled_tools = ["get_change_context", "trace_backend_flow", "get_test_plan"]
default_tools_approval_mode = "auto"
