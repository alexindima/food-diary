services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fooddiary}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fooddiary}"]
      interval: 180s
      timeout: 10s
      retries: 5

  db-init:
    image: ${INITIALIZER_IMAGE_REF:-ghcr.io/alexindima/food-diary/initializer:local}
    build:
      context: .
      dockerfile: FoodDiary.Initializer/Dockerfile
    command: ["update"]
    env_file:
      - .env
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-fooddiary};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      InitialAdmin__Email: ${InitialAdmin__Email:-admin@fooddiary.club}
      InitialAdmin__Password: ${InitialAdmin__Password:-}
      MailRelayClient__BaseUrl: http://mail-relay:5088
      MailRelayClient__AllowInsecureHttp: "true"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - full
      - backend

  mailrelay-postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MAIL_RELAY_POSTGRES_DB:-fooddiary_mailrelay}
      POSTGRES_USER: ${MAIL_RELAY_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${MAIL_RELAY_POSTGRES_PASSWORD:?Set MAIL_RELAY_POSTGRES_PASSWORD}
    ports:
      - "${MAIL_RELAY_POSTGRES_HOST_BIND:-127.0.0.1}:${MAIL_RELAY_POSTGRES_PORT:-5433}:5432"
    volumes:
      - mailrelay-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MAIL_RELAY_POSTGRES_USER:-postgres} -d ${MAIL_RELAY_POSTGRES_DB:-fooddiary_mailrelay}"]
      interval: 180s
      timeout: 10s
      retries: 5
    profiles:
      - full
      - backend

  mailrelay-db-init:
    image: ${MAIL_RELAY_INITIALIZER_IMAGE_REF:-ghcr.io/alexindima/food-diary/mailrelay-initializer:local}
    build:
      context: .
      dockerfile: MailRelay/FoodDiary.MailRelay.Initializer/Dockerfile
    command: ["update"]
    env_file:
      - .env
    environment:
      ConnectionStrings__DefaultConnection: Host=mailrelay-postgres;Port=5432;Database=${MAIL_RELAY_POSTGRES_DB:-fooddiary_mailrelay};Username=${MAIL_RELAY_POSTGRES_USER:-postgres};Password=${MAIL_RELAY_POSTGRES_PASSWORD:?Set MAIL_RELAY_POSTGRES_PASSWORD}
    depends_on:
      mailrelay-postgres:
        condition: service_healthy
    profiles:
      - full
      - backend

  mailinbox-postgres-tls-init:
    image: ${MAIL_INBOX_POSTGRES_TLS_INIT_IMAGE_REF:-fooddiary-mailinbox-postgres-tls-init:local}
    build:
      context: .
      dockerfile: MailInbox/FoodDiary.MailInbox.WebApi/Dockerfile.postgres-tls-init
    user: "0:0"
    volumes:
      - mailinbox-postgres-server-tls:/server
      - mailinbox-postgres-client-ca:/trust
    restart: "no"
    profiles:
      - mail-inbox

  mailinbox-postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MAIL_INBOX_POSTGRES_DB:-fooddiary_mailinbox}
      POSTGRES_USER: ${MAIL_INBOX_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${MAIL_INBOX_POSTGRES_PASSWORD:?Set MAIL_INBOX_POSTGRES_PASSWORD}
    ports:
      - "${MAIL_INBOX_POSTGRES_HOST_BIND:-127.0.0.1}:${MAIL_INBOX_POSTGRES_PORT:-5434}:5432"
    volumes:
      - mailinbox-postgres-data:/var/lib/postgresql/data
      - mailinbox-postgres-server-tls:/run/postgresql-tls:ro
      - ./MailInbox/FoodDiary.MailInbox.WebApi/mailinbox-pg_hba.conf:/etc/postgresql/mailinbox-pg_hba.conf:ro
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/postgresql-tls/server.crt
      - -c
      - ssl_key_file=/run/postgresql-tls/server.key
      - -c
      - ssl_ca_file=/run/postgresql-tls/ca.crt
      - -c
      - ssl_min_protocol_version=TLSv1.2
      - -c
      - hba_file=/etc/postgresql/mailinbox-pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql \"host=mailinbox-postgres port=5432 dbname=$${POSTGRES_DB} user=$${POSTGRES_USER} sslmode=verify-full sslrootcert=/run/postgresql-tls/ca.crt\" -v ON_ERROR_STOP=1 -c 'select 1' >/dev/null"]
      interval: 180s
      timeout: 10s
      retries: 5
    depends_on:
      mailinbox-postgres-tls-init:
        condition: service_completed_successfully
    profiles:
      - mail-inbox

  mailinbox-db-init:
    image: ${MAIL_INBOX_INITIALIZER_IMAGE_REF:-ghcr.io/alexindima/food-diary/mailinbox-initializer:local}
    build:
      context: .
      dockerfile: MailInbox/FoodDiary.MailInbox.Initializer/Dockerfile
    command: ["update"]
    env_file:
      - .env
    environment:
      ConnectionStrings__DefaultConnection: Host=mailinbox-postgres;Port=5432;Database=${MAIL_INBOX_POSTGRES_DB:-fooddiary_mailinbox};Username=${MAIL_INBOX_POSTGRES_USER:-postgres};Password=${MAIL_INBOX_POSTGRES_PASSWORD:?Set MAIL_INBOX_POSTGRES_PASSWORD};SSL Mode=VerifyFull;Root Certificate=/run/mailinbox-postgres-ca/ca.crt
      MailInboxRuntimeDatabase__ProvisionRole: "true"
      MailInboxRuntimeDatabase__RoleName: ${MAIL_INBOX_POSTGRES_RUNTIME_USER:-mailinbox_runtime}
      MailInboxRuntimeDatabase__Password: ${MAIL_INBOX_POSTGRES_RUNTIME_PASSWORD:?Set MAIL_INBOX_POSTGRES_RUNTIME_PASSWORD}
    volumes:
      - mailinbox-postgres-client-ca:/run/mailinbox-postgres-ca:ro
    depends_on:
      mailinbox-postgres:
        condition: service_healthy
    profiles:
      - mail-inbox

  rabbitmq:
    image: rabbitmq:4-management@sha256:eb5295d083325da5929a5ade766684d4019ffd2bce8bc7e43d6f9a05cafc8646
    restart: unless-stopped
    ports:
      - "${RABBITMQ_HOST_BIND:-127.0.0.1}:${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_HOST_BIND:-127.0.0.1}:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${MailRelayBroker__UserName:-guest}
      RABBITMQ_DEFAULT_PASS: ${MailRelayBroker__Password:?Set MailRelayBroker__Password}
      RABBITMQ_DEFAULT_VHOST: ${MailRelayBroker__VirtualHost:-/}
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 180s
      timeout: 20s
      retries: 10
      start_period: 60s
    profiles:
      - full
      - backend

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 180s
      timeout: 10s
      retries: 5
    profiles:
      - full
      - backend

  api:
    image: ${API_IMAGE_REF:-ghcr.io/alexindima/food-diary/api:local}
    build:
      context: .
      dockerfile: FoodDiary.Web.Api/Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${API_HOST_BIND:-127.0.0.1}:${API_PORT:-5000}:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-fooddiary};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      BuildInfo__CommitSha: ${DEPLOY_COMMIT_SHA:-unknown}
      BuildInfo__ImageTag: ${API_IMAGE_TAG:-unknown}
      MailRelayClient__BaseUrl: http://mail-relay:5088
      MailRelayClient__AllowInsecureHttp: "true"
      MailRelayClient__ApiKey: ${MailRelayClient__ApiKey:-}
      MailInboxClient__BaseUrl: https://mail.fooddiary.club:5098
      MailInboxClient__MetadataApiKey: ${MAIL_INBOX_METADATA_API_KEY:?Set MAIL_INBOX_METADATA_API_KEY}
      MailInboxClient__ContentApiKey: ${MAIL_INBOX_CONTENT_API_KEY:?Set MAIL_INBOX_CONTENT_API_KEY}
      MailInboxClient__StateApiKey: ${MAIL_INBOX_STATE_API_KEY:?Set MAIL_INBOX_STATE_API_KEY}
      DataProtection__KeyRingPath: /var/lib/fooddiary/data-protection-keys
    env_file:
      - .env
    volumes:
      - api-data-protection-keys:/var/lib/fooddiary/data-protection-keys
    tmpfs:
      - /tmp:size=32m,mode=1777,nosuid,nodev
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/health/ready >/dev/null || exit 1"]
      interval: 180s
      timeout: 10s
      retries: 6
      start_period: 30s
    depends_on:
      db-init:
        condition: service_completed_successfully
      mail-relay:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - full
      - backend

  mail-relay:
    image: ${MAIL_RELAY_IMAGE_REF:-ghcr.io/alexindima/food-diary/mail-relay:local}
    build:
      context: .
      dockerfile: MailRelay/FoodDiary.MailRelay.WebApi/Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${MAIL_RELAY_HOST_BIND:-127.0.0.1}:${MAIL_RELAY_PORT:-5088}:5088"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ConnectionStrings__DefaultConnection: Host=mailrelay-postgres;Port=5432;Database=${MAIL_RELAY_POSTGRES_DB:-fooddiary_mailrelay};Username=${MAIL_RELAY_POSTGRES_USER:-postgres};Password=${MAIL_RELAY_POSTGRES_PASSWORD:?Set MAIL_RELAY_POSTGRES_PASSWORD}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      MailRelay__ApiKey: ${MailRelay__ApiKey:-}
      MailRelay__RequireMailgunWebhookSignature: ${MailRelay__RequireMailgunWebhookSignature:-false}
      MailRelay__MailgunWebhookSigningKey: ${MailRelay__MailgunWebhookSigningKey:-}
      MailRelay__RequireAwsSesSnsSignature: ${MailRelay__RequireAwsSesSnsSignature:-true}
      MailRelay__ExpectedAwsSesSnsTopicArn: ${MailRelay__ExpectedAwsSesSnsTopicArn:-arn:aws:sns:us-east-1:000000000000:fooddiary-local}
      MailRelayBroker__HostName: rabbitmq
    env_file:
      - .env
    tmpfs:
      - /tmp:size=32m,mode=1777,nosuid,nodev
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5088/health/ready >/dev/null || exit 1"]
      interval: 180s
      timeout: 10s
      retries: 6
      start_period: 30s
    depends_on:
      mailrelay-db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    profiles:
      - full
      - backend

  mail-inbox:
    image: ${MAIL_INBOX_IMAGE_REF:-ghcr.io/alexindima/food-diary/mail-inbox:local}
    build:
      context: .
      dockerfile: MailInbox/FoodDiary.MailInbox.WebApi/Dockerfile
    restart: unless-stopped
    user: "0:0"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    ports:
      - "${MAIL_INBOX_HOST_BIND:-127.0.0.1}:${MAIL_INBOX_PORT:-5098}:5098"
      - "${MAIL_INBOX_SMTP_HOST_BIND:-0.0.0.0}:${MAIL_INBOX_SMTP_PORT:-2525}:2525"
    environment:
      ConnectionStrings__DefaultConnection: Host=mailinbox-postgres;Port=5432;Database=${MAIL_INBOX_POSTGRES_DB:-fooddiary_mailinbox};Username=${MAIL_INBOX_POSTGRES_RUNTIME_USER:-mailinbox_runtime};Password=${MAIL_INBOX_POSTGRES_RUNTIME_PASSWORD:?Set MAIL_INBOX_POSTGRES_RUNTIME_PASSWORD};SSL Mode=VerifyFull;Root Certificate=/run/mailinbox-postgres-ca/ca.crt
      MailInboxRuntimeDatabase__RoleName: ${MAIL_INBOX_POSTGRES_RUNTIME_USER:-mailinbox_runtime}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: https://+:5098
      ASPNETCORE_Kestrel__Certificates__Default__Path: /run/mail-inbox-tls/fullchain.pem
      ASPNETCORE_Kestrel__Certificates__Default__KeyPath: /run/mail-inbox-tls/privkey.pem
      MailInboxHttp__MetadataApiKey: ${MAIL_INBOX_METADATA_API_KEY:?Set MAIL_INBOX_METADATA_API_KEY}
      MailInboxHttp__ContentApiKey: ${MAIL_INBOX_CONTENT_API_KEY:?Set MAIL_INBOX_CONTENT_API_KEY}
      MailInboxHttp__StateApiKey: ${MAIL_INBOX_STATE_API_KEY:?Set MAIL_INBOX_STATE_API_KEY}
      MailInboxSmtp__CertificatePath: /run/mail-inbox-tls/fullchain.pem
      MailInboxSmtp__PrivateKeyPath: /run/mail-inbox-tls/privkey.pem
      MailInboxSmtp__TrustedRelayNetworks__0: ${MAIL_INBOX_TRUSTED_RELAY_NETWORK:?Set MAIL_INBOX_TRUSTED_RELAY_NETWORK}
      MailInboxSmtp__AllowUntrustedSources: ${MAIL_INBOX_ALLOW_UNTRUSTED_SOURCES:-true}
    env_file:
      - .env
    volumes:
      - /etc/letsencrypt/live/mail.fooddiary.club:/run/letsencrypt/live/mail.fooddiary.club:ro
      - /etc/letsencrypt/archive/mail.fooddiary.club:/run/letsencrypt/archive/mail.fooddiary.club:ro
      - mailinbox-postgres-client-ca:/run/mailinbox-postgres-ca:ro
    tmpfs:
      - /tmp:size=16m,mode=1777,nosuid,nodev
      - /run/mail-inbox-tls:size=1m,mode=0700,noexec,nosuid,nodev
    healthcheck:
      test: ["CMD", "dotnet", "FoodDiary.MailInbox.WebApi.dll", "--healthcheck"]
      interval: 180s
      timeout: 10s
      retries: 6
      start_period: 30s
    depends_on:
      mailinbox-db-init:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
          - mail.fooddiary.club
    profiles:
      - mail-inbox

  telegram-bot:
    image: ${TELEGRAM_BOT_IMAGE_REF:-ghcr.io/alexindima/food-diary/telegram-bot:local}
    build:
      context: .
      dockerfile: FoodDiary.Telegram.Bot/Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777,nosuid,nodev
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - full

  job-manager:
    image: ${JOB_MANAGER_IMAGE_REF:-ghcr.io/alexindima/food-diary/job-manager:local}
    build:
      context: .
      dockerfile: FoodDiary.JobManager/Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777,nosuid,nodev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-fooddiary};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      MailRelayClient__BaseUrl: http://mail-relay:5088
      MailRelayClient__AllowInsecureHttp: "true"
      MailRelayClient__ApiKey: ${MailRelayClient__ApiKey:-}
    env_file:
      - .env
    depends_on:
      db-init:
        condition: service_completed_successfully
    profiles:
      - full
      - jobs

  client:
    image: ${CLIENT_IMAGE_REF:-ghcr.io/alexindima/food-diary/client:local}
    build:
      context: FoodDiary.Web.Client
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    ports:
      - "${CLIENT_HOST_BIND:-127.0.0.1}:${CLIENT_PORT:-4200}:80"
    tmpfs:
      - /var/cache/nginx:size=8m,mode=0755,nosuid,nodev
      - /var/run:size=1m,mode=0755,nosuid,nodev
    depends_on:
      api:
        condition: service_healthy
    profiles:
      - full

  tech-radar:
    image: ${TECH_RADAR_IMAGE_REF:-ghcr.io/alexindima/food-diary/tech-radar:local}
    build:
      context: FoodDiary.TechRadar
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    ports:
      - "${TECH_RADAR_HOST_BIND:-127.0.0.1}:${TECH_RADAR_PORT:-4210}:80"
    tmpfs:
      - /var/cache/nginx:size=8m,mode=0755,nosuid,nodev
      - /var/run:size=1m,mode=0755,nosuid,nodev
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - full

  nginx:
    image: nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites-enabled:/etc/nginx/sites-enabled:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/fooddiary.club:/var/www/fooddiary.club:ro
      - /var/www/admin.fooddiary.club:/var/www/admin.fooddiary.club:ro
      - /var/www/storybook.fooddiary.club:/var/www/storybook.fooddiary.club:ro
      - /var/log/nginx:/var/log/nginx
    tmpfs:
      - /var/cache/nginx:size=8m,mode=0755,nosuid,nodev
      - /var/run:size=1m,mode=0755,nosuid,nodev
    profiles:
      - full

volumes:
  postgres-data:
  mailrelay-postgres-data:
  mailinbox-postgres-data:
  mailinbox-postgres-server-tls:
  mailinbox-postgres-client-ca:
  api-data-protection-keys:
